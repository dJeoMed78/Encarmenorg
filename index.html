        <div id="loading-recovery" style="display: none; margin-top: 20px; flex-direction: column; align-items: center; gap: 8px;">
          <p style="font-size: 12px; color: #a8a29e; max-width: 280px; margin: 0;">¿Tarda en cargar debido a la memoria caché de tu navegador?</p>
          <button onclick="try{if(window.caches){caches.keys().then(function(k){return Promise.all(k.map(function(c){return caches.delete(c);}));}).then(function(){window.location.reload();});}else{window.location.reload();}}catch(e){window.location.reload();}" style="background: #0f766e; color: #ffffff; border: none; padding: 8px 16px; border-radius: 9999px; font-weight: 600; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(15,118,110,0.25);">

          </button>
        </div>
      </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script>
      // Display recovery button if app takes longer than 3.5 seconds to mount
      setTimeout(function() {
        var rec = document.getElementById('loading-recovery');
        if (rec) rec.style.display = 'flex';
      }, 3500);

      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var rec = document.getElementById('loading-recovery');
        var sub = document.getElementById('loading-subtext');
        if (sub) sub.textContent = 'Actualización en curso...';
        if (rec) rec.style.display = 'flex';
      });
    </script>
