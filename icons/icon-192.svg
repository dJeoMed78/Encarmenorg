<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="192" height="192" rx="115" fill="url(#grad)" />
  
  <!-- Subtle decorative rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.15" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
  
  <!-- Main Storefront / Palm & Pin Emblem -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Location Pin Backdrop -->
    <path d="M 256 90 C 185 90 128 147 128 218 C 128 305 235 410 250 424 C 253 427 259 427 262 424 C 277 410 384 305 384 218 C 384 147 327 90 256 90 Z" fill="#ffffff" />
    
    <!-- Inside pin: Store icon with amber accent -->
    <!-- Awning -->
    <path d="M 180 190 L 195 235 L 215 235 L 210 190 Z" fill="#d97706" />
    <path d="M 215 190 L 220 235 L 240 235 L 235 190 Z" fill="#f59e0b" />
    <path d="M 240 190 L 245 235 L 267 235 L 272 190 Z" fill="#d97706" />
    <path d="M 277 190 L 272 235 L 292 235 L 297 190 Z" fill="#f59e0b" />
    <path d="M 302 190 L 297 235 L 317 235 L 332 190 Z" fill="#d97706" />
    
    <!-- Roof bar -->
    <path d="M 170 180 L 342 180 L 332 190 L 180 190 Z" fill="#b45309" />
    
    <!-- Building Pillars & Door -->
    <rect x="185" y="235" width="142" height="55" fill="#fef3c7" />
    <rect x="236" y="248" width="40" height="42" rx="4" fill="#d97706" />
    <rect x="198" y="248" width="28" height="28" rx="3" fill="#f59e0b" />
    <rect x="286" y="248" width="28" height="28" rx="3" fill="#f59e0b" />
  </g>
  
  <!-- Carmen text badge at bottom -->
  <rect x="136" y="435" width="240" height="38" rx="19" fill="#1e293b" opacity="0.9" />
  <text x="256" y="460" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="2">CD. DEL CARMEN</text>
</svg>
