<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>FreeLLMAPI · Gemini</title><style>*{box-sizing:border-box}body{margin:0;background:#10131b;color:#edf0f7;font:15px system-ui;height:100dvh;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid #29303e;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#151a24}.brand{font-weight:700}.projectbar{display:flex;gap:7px;align-items:center}.projectbar select{max-width:180px}.projectbar button,.side button{border:1px solid #394354;border-radius:10px;background:#222a38;color:#edf0f7;padding:8px 10px}.layout{display:flex;flex:1;min-height:0}.chatmain{flex:1;min-width:0;display:flex;flex-direction:column;width:100%}.projecttitle{color:#aeb7c8;font-size:12px;padding:0 4px 8px}.brand span{color:#9b8cff}.model{font-size:12px;color:#aeb7c8;background:#222a38;padding:7px 10px;border-radius:20px}.main{width:min(900px,100%);margin:auto;flex:1;display:flex;flex-direction:column;min-height:0;padding:18px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:12px 0}.welcome{margin:auto;text-align:center;color:#aeb7c8}.welcome h1{color:#f2f3f8}.msg{max-width:88%;padding:14px 16px;border-radius:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#5144a7}.assistant{align-self:flex-start;background:#1c2431;border:1px solid #2b3545}.composer{border:1px solid #394354;background:#1a202c;border-radius:17px;padding:8px;display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;resize:none;max-height:150px;min-height:44px;border:0;outline:0;background:transparent;color:white;font:inherit;padding:10px}.send,.login button{border:0;border-radius:11px;background:#7867e8;color:white;padding:12px 17px;font-weight:650}.send:disabled{opacity:.4}.hint{text-align:center;color:#788397;font-size:11px;padding:9px}.login{margin:auto;width:min(380px,100%);background:#1b2230;border:1px solid #303a4a;padding:25px;border-radius:20px}.login p{color:#aeb7c8;font-size:13px}.login input{width:100%;padding:13px;border-radius:10px;border:1px solid #3c4658;background:#111722;color:white;margin:10px 0}.login button{width:100%}.error{color:#ff9e9e;font-size:13px}@media(max-width:500px){.main{padding:12px}.msg{max-width:96%}}</style></head><body><header class="top"><div class="brand">Free<span>LLM</span>API</div><div style="display:flex;gap:10px;align-items:center"><div class="projectbar"><select id="project" class="model" aria-label="Proyecto"><option value="">Cargando proyectos…</option></select><button id="newProject" type="button">+ Proyecto</button></div><select id="model" class="model" aria-label="Proveedor"><option value="auto">Automático · Gemini → Groq</option><option value="gemini-3.5-flash-lite">Gemini · Flash Lite</option><option value="openai/gpt-oss-20b">Groq · GPT-OSS 20B</option></select><button id="logout" hidden style="background:none;border:0;color:#b9c1d0">Salir</button></div></header><main class="main"><section id="login" class="login" hidden><h2>Entrar al chat</h2><p>Acceso privado al asistente experimental.</p><form id="loginForm"><input id="password" type="password" placeholder="Contraseña de acceso" autocomplete="current-password" required><button>Entrar</button><div id="loginError" class="error"></div></form></section><section id="chat" class="layout" hidden><div class="chatmain"><div class="main"><div id="messages" class="messages"><div class="welcome"><h1>¿En qué puedo ayudarte?</h1><div>Conectado a Gemini mediante FreeLLMAPI</div></div></div><form id="composer"><div class="composer"><textarea id="prompt" placeholder="Escribe tu mensaje..." rows="1" required></textarea><button class="send" id="send">Enviar</button></div></form><div class="hint">Historial del proyecto guardado en GitHub. Proveedores sujetos a sus límites gratuitos.</div></div></div></section></main><script>
const $=id=>document.getElementById(id);let history=[],activeProject=null,projects=[];
function bubble(role,text){const n=document.createElement('div');n.className='msg '+role;n.textContent=text;$('messages').append(n);$('messages').scrollTop=$('messages').scrollHeight;return n}
async function auth(action,password){return fetch('/api/auth',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action,password})})}
async function memory(action,data={}){const r=await fetch('/api/projects',{method:action==='list'?'GET':'POST',credentials:'same-origin',headers:{'content-type':'application/json'},...(action==='list'?{}:{body:JSON.stringify({action,...data})})});const j=await r.json();if(!r.ok)throw Error(j.error||'Error de memoria');return j}
function show(ok){$('login').hidden=ok;$('chat').hidden=!ok;$('logout').hidden=!ok}
function renderProjects(){$('project').innerHTML='';projects.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('project').append(o)});$('project').value=activeProject||''}
async function refreshProjects(){const j=await memory('list');projects=j.projects||[];renderProjects();if(!activeProject&&projects.length)await selectProject(projects[0].id)}
async function selectProject(id){activeProject=id;history=[];$('messages').innerHTML='';renderProjects();try{const j=await memory('load',{projectId:id});const re=/### ([^\n]+) · (user|assistant|system|event)\n\n([\s\S]*?)(?=\n### |$)/g;let m;while((m=re.exec(j.content))!==null){const role=m[2],content=m[3].trim();if(role==='user'||role==='assistant'){history.push({role,content});bubble(role,content)}}if(!history.length)$('messages').innerHTML='<div class="welcome"><h1>¿En qué puedo ayudarte?</h1><div>Proyecto nuevo · historial en GitHub</div></div>'}catch(e){bubble('assistant','No se pudo recuperar el historial: '+e.message)}}
async function createProject(){const name=prompt('Nombre del nuevo proyecto:');if(!name||!name.trim())return;try{const j=await memory('create',{name:name.trim()});await refreshProjects();await selectProject(j.project.id)}catch(e){alert('No se pudo crear el proyecto: '+e.message)}}
$('newProject').onclick=createProject;$('project').onchange=e=>selectProject(e.target.value);
async function init(){try{const r=await auth('status');show(!!(await r.json()).authenticated);if(!$('chat').hidden){try{await refreshProjects()}catch(e){bubble('assistant','Memoria no conectada: '+e.message)}}}catch{show(false)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await auth('login',$('password').value),j=await r.json();if(!r.ok){$('loginError').textContent=j.error||'No se pudo iniciar sesión';return}$('password').value='';show(true);try{await refreshProjects()}catch(err){bubble('assistant','Memoria pendiente de configurar: '+err.message)}};
$('logout').onclick=async()=>{await auth('logout');history=[];activeProject=null;$('messages').innerHTML='';show(false)};
$('composer').onsubmit=async e=>{e.preventDefault();const t=$('prompt').value.trim();if(!t)return;if(!activeProject){alert('Primero crea o selecciona un proyecto.');return}$('prompt').value='';bubble('user',t);history.push({role:'user',content:t});$('send').disabled=true;const wait=bubble('assistant','Pensando…');try{await memory('append',{projectId:activeProject,role:'user',message:t});const r=await fetch('/api/v1/chat/completions',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({model:$('model').value,messages:history,max_tokens:1024})}),j=await r.json();if(!r.ok)throw Error(j.error?.message||'HTTP '+r.status);const a=j.choices?.[0]?.message?.content||'(Sin respuesta)';const used=j.provider||'Proveedor';wait.textContent=(j.failover?'Respaldo automático · ':'')+used+'\n\n'+a;history.push({role:'assistant',content:a});await memory('append',{projectId:activeProject,role:'assistant',message:a})}catch(err){wait.textContent='Error: '+err.message;history.pop()}finally{$('send').disabled=false;$('prompt').focus()}};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};init();
</script></body></html>
