<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 220" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Sky & Ocean Dusk Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="45%" stop-color="#102a45" />
      <stop offset="70%" stop-color="#0f2137" />
      <stop offset="100%" stop-color="#07111e" />
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2642" />
      <stop offset="50%" stop-color="#0a1c33" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <!-- Orange Drop Shadow / 3D Extrusion for EMPRESAS EN CARMEN -->
    <filter id="orangeExtrude" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#ea580c" flood-opacity="1" />
      <feDropShadow dx="0" dy="4" stdDeviation="0.5" flood-color="#c2410c" flood-opacity="1" />
      <feDropShadow dx="0" dy="6" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Cyan Glow for Subtitles -->
    <filter id="cyanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00d2ff" flood-opacity="0.8" />
    </filter>

    <!-- Dolphin Badge Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .txt-top-label {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 34px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 2px;
        paint-order: stroke fill;
        stroke: #00d2ff;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .txt-main-title {
        font-family: 'Plus Jakarta Sans', Impact, system-ui, -apple-system, sans-serif;
        font-size: 68px;
        font-weight: 950;
        fill: #ffffff;
        letter-spacing: 2px;
        paint-order: stroke fill;
        stroke: #f97316;
        stroke-width: 8px;
        stroke-linejoin: round;
      }
      .txt-bottom-badge {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 20px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Background Sky & Night Skyline -->
  <rect width="1200" height="140" fill="url(#skyGrad)" />
  <rect y="140" width="1200" height="80" fill="url(#waterGrad)" />

  <!-- City Skyline Silhouette (Malecón Costero de Ciudad del Carmen) -->
  <g fill="#061321" opacity="0.95">
    <!-- Church towers / domes / buildings -->
    <rect x="0" y="115" width="1200" height="26" />
    <!-- Church Tower Left-Center -->
    <path d="M 390 120 L 400 95 L 405 75 L 410 95 L 420 120 Z" />
    <rect x="398" y="90" width="14" height="30" />
    <!-- Monument / Buildings -->
    <rect x="220" y="105" width="45" height="20" />
    <rect x="270" y="110" width="35" height="15" />
    <rect x="330" y="108" width="50" height="17" />
    <rect x="430" y="102" width="60" height="23" />
    <rect x="500" y="106" width="40" height="19" />
    <rect x="680" y="100" width="55" height="25" />
    <!-- Church Dome Right-Center -->
    <path d="M 745 120 Q 755 85 765 85 Q 775 85 785 120 Z" />
    <rect x="758" y="75" width="14" height="25" />
    <rect x="800" y="105" width="70" height="20" />
    <rect x="880" y="102" width="50" height="23" />
    <rect x="940" y="107" width="90" height="18" />
    <rect x="1040" y="110" width="160" height="15" />
  </g>

  <!-- Soft City Lights & Water Reflections -->
  <g opacity="0.45">
    <ellipse cx="405" cy="144" rx="35" ry="3" fill="#fbbf24" />
    <ellipse cx="765" cy="144" rx="40" ry="3" fill="#f59e0b" />
    <ellipse cx="250" cy="144" rx="25" ry="2" fill="#38bdf8" />
    <ellipse cx="850" cy="144" rx="35" ry="2" fill="#fcd34d" />
    <ellipse cx="980" cy="144" rx="30" ry="2" fill="#38bdf8" />
  </g>

  <!-- Water Reflection Lines -->
  <line x1="0" y1="140" x2="1200" y2="140" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8" />
  <line x1="0" y1="152" x2="1200" y2="152" stroke="#162e4c" stroke-width="1" opacity="0.6" />
  <line x1="0" y1="168" x2="1200" y2="168" stroke="#0e2239" stroke-width="1" opacity="0.4" />

  <!-- CENTER LOGO MEDALLION (Dolphin emblem) -->
  <g transform="translate(600, 52)" filter="url(#badgeShadow)">
    <!-- Medallion Circle -->
    <circle cx="0" cy="0" r="38" fill="#ffffff" stroke="#00d2ff" stroke-width="3.5" />
    <!-- Embedded Dolphin Icon -->
    <image href="data:image/png;base64,"
      x="-34"
      y="-36"
      width="68"
      height="72"
    />
  </g>

  <!-- Top Line: DIRECTORIO (Left) and EMPRESARIAL (Right) -->
  <text x="360" y="58" class="txt-top-label" text-anchor="middle" filter="url(#cyanGlow)">DIRECTORIO</text>
  <text x="840" y="58" class="txt-top-label" text-anchor="middle" filter="url(#cyanGlow)">EMPRESARIAL</text>

  <!-- Main Headline: EMPRESAS EN CARMEN -->
  <text x="600" y="132" class="txt-main-title" text-anchor="middle" filter="url(#orangeExtrude)">EMPRESAS EN CARMEN</text>

  <!-- Bottom Ribbon: ¡PUBLICITA TU NEGOCIO GRATIS! -->
  <g transform="translate(600, 185)">
    <!-- Cyan pill background -->
    <rect x="-240" y="-22" width="480" height="40" rx="10" fill="#00c8f8" stroke="#ffffff" stroke-width="2.5" />
    <text x="0" y="6" class="txt-bottom-badge" text-anchor="middle">¡PUBLICITA TU NEGOCIO GRATIS!</text>
  </g>
</svg>
