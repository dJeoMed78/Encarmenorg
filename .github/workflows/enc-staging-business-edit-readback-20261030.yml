name: ENCARMEN verify deletion of manual business 20272 from Staging MariaDB
on:
  push:
    branches: [coord/enc-staging-005-diagnostic-20261030]
    paths: [.github/workflows/enc-staging-business-edit-readback-20261030.yml]
permissions:
  contents: read
concurrency:
  group: encarmen-staging-runtime-deploy
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only SQL deletion proof and public directory absence
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -qq -y sshpass >/dev/null 2>&1
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          fp=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')
          test "$fp" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          export SSHPASS
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15 u293982346@45.137.159.114 'python3 -' <<'PY'
          import pathlib,os,stat,subprocess,tempfile,urllib.request,urllib.error,json
          H=pathlib.Path.home();S=H/'domains/staging.encarmen.org/hbuilds';E=S/'config/.env';D='u293982346_encarmentest'
          name='30102026'
          print('OPERATION=READ_ONLY_SQL_AND_PUBLIC_GET',flush=True)
          if not E.is_file() or E.is_symlink() or (E.stat().st_mode&0o077):raise SystemExit('RESULT=CONFIG_FILE_UNSAFE')
          env={};dup=[]
          for line in E.read_text().splitlines():
              line=line.strip().removeprefix('export ').strip()
              if not line or line.startswith('#') or '=' not in line:continue
              k,v=line.split('=',1);k=k.strip()
              if k in env:dup.append(k)
              env[k]=v.strip().strip("'").strip('"')
          keys=('APP_ENV','DB_NAME','DB_HOST','DB_USER','DB_PASSWORD','STAGING_READ_ONLY','STAGING_DB_CONFIRMED')
          if any(k in dup for k in keys):raise SystemExit('RESULT=DUPLICATE_CONFIG')
          if env.get('APP_ENV')!='staging' or env.get('DB_NAME')!=D or env.get('DB_USER') in (None,'','u293982346_appuser'):raise SystemExit('RESULT=ISOLATION_REJECTED')
          backup=H/'encarmen-staging-backups'
          if not backup.is_dir() or backup.is_symlink():raise SystemExit('RESULT=BACKUP_PATH_UNSAFE')
          fd,tmp=tempfile.mkstemp(dir=backup,prefix='.enc-edit-readback-',suffix='.cnf')
          try:
              os.fchmod(fd,0o600)
              with os.fdopen(fd,'w') as f:
                  f.write('[client]\n')
                  for k,v in (('host','DB_HOST'),('user','DB_USER'),('password','DB_PASSWORD')):
                      secret=env.get(v,'').replace('\\','\\\\').replace('"','\\"')
                      f.write(k+'="'+secret+'"\n')
              def sql(q):
                  p=subprocess.run(['mariadb','--defaults-extra-file='+tmp,'-D',D,'--batch','--skip-column-names','-e',q],capture_output=True,text=True,timeout=20)
                  if p.returncode:raise RuntimeError('SQL_READ_FAILED')
                  return p.stdout.strip().splitlines()
              identity=sql("SELECT DATABASE(),SUBSTRING_INDEX(CURRENT_USER(),'@',1)")
              if identity!=[D+'\t'+env['DB_USER']]:raise SystemExit('RESULT=SQL_WRONG_IDENTITY')
              if sql('SELECT env_name,db_name FROM encarmen_environment_marker')!=['staging\t'+D]:raise SystemExit('RESULT=SQL_WRONG_MARKER')
              if 'u293982346_encarmenapp' in sql('SELECT SCHEMA_NAME FROM information_schema.SCHEMATA'):raise SystemExit('RESULT=PROD_VISIBLE')
              print('SQL_ENVIRONMENT=STAGING_ISOLATED_VERIFIED',flush=True)
              id_rows=sql('SELECT COUNT(*) FROM businesses WHERE id=20272')
              name_rows=sql("SELECT COUNT(*) FROM businesses WHERE BINARY name=BINARY CONVERT(0x3330313032303236 USING utf8mb4)")
              total_rows=sql('SELECT COUNT(*) FROM businesses')
              print('SQL_TARGET_ID_COUNT='+str(id_rows[0] if id_rows else 'missing'),flush=True)
              print('SQL_TARGET_NAME_COUNT='+str(name_rows[0] if name_rows else 'missing'),flush=True)
              print('SQL_BUSINESS_COUNT='+str(total_rows[0] if total_rows else 'missing'),flush=True)
              if id_rows!=['0']:raise SystemExit('RESULT=BUSINESS_ID_STILL_IN_SQL')
              if name_rows!=['0']:raise SystemExit('RESULT=TARGET_NAME_STILL_IN_SQL')
              uri='https://staging.encarmen.org/api/businesses/20272?verify_deleted='+str(os.getpid())
              request=urllib.request.Request(uri,headers={'Cache-Control':'no-store','User-Agent':'ENC-Staging-Delete-Readback/1'})
              try:
                  with urllib.request.urlopen(request,timeout=15) as response:
                      detail_status=response.status
                      data=json.loads(response.read(250000))
              except urllib.error.HTTPError as exc:
                  detail_status=exc.code
                  try:data=json.loads(exc.read(250000))
                  except Exception:data={}
              entry=data.get('business') if isinstance(data,dict) else None
              detail_still_visible=detail_status==200 and isinstance(entry,dict) and str(entry.get('id'))=='20272'
              print('PUBLIC_DETAIL_HTTP='+str(detail_status),flush=True)
              print('PUBLIC_DETAIL_CONTAINS_TARGET='+str(detail_still_visible).lower(),flush=True)
              if detail_still_visible:raise SystemExit('RESULT=PUBLIC_DETAIL_STILL_VISIBLE')
              request=urllib.request.Request('https://staging.encarmen.org/api/businesses?verify_deleted='+str(os.getpid()),headers={'Cache-Control':'no-store','User-Agent':'ENC-Staging-Delete-Readback/1'})
              with urllib.request.urlopen(request,timeout=15) as response:
                  list_status=response.status
                  listing=json.loads(response.read(10000000))
              businesses=listing.get('businesses') if isinstance(listing,dict) else None
              if list_status!=200 or not isinstance(businesses,list):raise SystemExit('RESULT=PUBLIC_LIST_UNAVAILABLE')
              listed=any(str(x.get('id'))=='20272' or x.get('name')=='30102026' for x in businesses if isinstance(x,dict))
              print('PUBLIC_DIRECTORY_COUNT='+str(len(businesses)),flush=True)
              print('PUBLIC_DIRECTORY_CONTAINS_TARGET='+str(listed).lower(),flush=True)
              if listed:raise SystemExit('RESULT=PUBLIC_DIRECTORY_STILL_VISIBLE')
              print('RESULT=STAGING_BUSINESS_20272_DELETED_SQL_AND_PUBLIC',flush=True)
          finally:
              os.unlink(tmp)
          PY
