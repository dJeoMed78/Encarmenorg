name: ENC control board verification
on:
  push:
    branches: [work/enc-control-board-20261113]
  pull_request:
    branches: [ia-desarrollo]
    paths: ['public/control/**', 'src/server/control*.mjs', 'tests/control*.test.mjs', 'tests/woo-retirement-regression.test.mjs', 'server.ts', 'src/**', 'README.md', '.env.example', 'render.yaml', 'ops/control/**', '.github/workflows/enc-control-operations.yml', '.github/workflows/enc-control-board-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/control-board.test.mjs tests/control-instructions.test.mjs tests/control-instruction-auth-regression.test.mjs tests/control-issue-table.test.mjs tests/ai-admin-auth-regression.test.mjs tests/woo-retirement-regression.test.mjs tests/retired-credentials-regression.test.mjs
      - run: node --check public/control/app.js
      - run: npm run lint
      - name: Reject tracked stale server bundles
        run: |
          ! git ls-files --error-unmatch server.js >/dev/null 2>&1
          ! git ls-files --error-unmatch api/server.bundle.js >/dev/null 2>&1
      - run: npm run build
      - name: Verify deploy assets and runtime bundle
        run: |
          test -s server.js
          test -s api/server.bundle.js
          cmp -s server.js api/server.bundle.js
          test -s dist/control/index.html
          test -s dist/control/style.css
          test -s dist/control/app.js
          grep -q 'ENC-CONTROL-20261113' server.js
