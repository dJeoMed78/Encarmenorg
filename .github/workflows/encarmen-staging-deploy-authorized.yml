name: ENCARMEN - Despliegue Staging autorizado y reversible
# Authorized scope: PR 52 + PR 53, only staging.encarmen.org; immutable commit.
on:
  push:
    branches: [coord/encarmen-work-control-001]
    paths: [.github/workflows/encarmen-staging-deploy-authorized.yml]
permissions:
  contents: read
concurrency:
  group: encarmen-authorized-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SSH_PASSWORD: "${{ secrets.ENC_STAGING_SSH_PASSWORD }}"
    steps:
      - name: Obtener herramientas de coordinación
        uses: actions/checkout@v4
        with:
          path: coordination
          persist-credentials: false
      - name: Obtener versión exacta autorizada
        uses: actions/checkout@v4
        with:
          ref: 9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9
          path: candidate
          persist-credentials: false
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Compilar y comprobar commit inmutable
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9'
          npm ci --ignore-scripts
          npm run lint
          node scripts/update_version.cjs
          node --test tests/release-stamp.test.mjs
          npx vite build
          npx esbuild server.ts --bundle --platform=node --format=esm --packages=external --outfile=server.js
          mkdir -p api
          cp server.js api/server.bundle.js
          printf '%s\n' '9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9' > dist/encarmen-release.txt
          test "$(cat dist/encarmen-release.txt)" = '9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9'
          tar -czf ../staging-payload.tar.gz server.js dist api/server.bundle.js
          gzip -t ../staging-payload.tar.gz
          echo 'IMMUTABLE_CANDIDATE_BUILD=PASS'
      - name: SSH autenticado y huella exacta
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          echo 'STAGING_SSH_HOST_KEY=PASS'
      - name: Verificar aislamiento SQL, versión activa y respaldos existentes
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          set +e
          proof=$(sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'python3 -' < coordination/ops/staging-backups/preflight_staging_deploy.py)
          status=$?
          set -e
          printf '%s\n' "$proof"
          test "$status" -eq 0
          grep -Fxq 'STAGING_PREFLIGHT=PASS' <<<"$proof"
          old=$(sed -n 's/^STAGING_PRE_DEPLOY_OLD_LINK=//p' <<<"$proof")
          [[ "$old" =~ ^versions/[a-zA-Z0-9-]+$ ]]
          test "$(grep -c '^STAGING_PRE_DEPLOY_OLD_LINK=' <<<"$proof")" -eq 1
          printf 'ENC_STAGING_EXPECTED_OLD_LINK=%s\n' "$old" >> "$GITHUB_ENV"
          echo 'STAGING_EXACT_ROLLBACK_RELEASE_FROZEN=PASS'
      - name: Respaldar base Staging con mecanismo oficial
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'python3 "$HOME/encarmen-staging-backups/bin/run_hostinger_backup.py"'
          echo 'STAGING_DATABASE_BACKUP_CHECK=PASS'
          # Verify a complete recent snapshot after the official rotation-safe backup.
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'python3 -' <<'REMOTE'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import subprocess
          folder=Path.home()/'encarmen-staging-backups/database'
          pairs=[p for p in folder.glob('staging-db-*.sql.gz') if p.is_file() and not p.is_symlink() and p.with_name(p.name[:-7]+'.json').is_file()]
          if not pairs:
              raise SystemExit('STAGING_BACKUP_NO_VERIFIED_PAIR')
          latest=max(pairs,key=lambda p:p.name)
          timestamp=datetime.strptime(latest.name[len('staging-db-'):-len('.sql.gz')],'%Y%m%dT%H%M%SZ').replace(tzinfo=timezone.utc)
          if datetime.now(timezone.utc)-timestamp > timedelta(days=4):
              raise SystemExit('STAGING_BACKUP_OLDER_THAN_FOUR_DAYS')
          if subprocess.run(['gzip','-t',str(latest)],capture_output=True,timeout=40).returncode:
              raise SystemExit('STAGING_BACKUP_CORRUPTED')
          print('STAGING_BACKUP_FRESH_AND_VERIFIED=PASS')
          REMOTE
      - name: Transferir paquete únicamente a directorio privado Staging
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'test ! -e "$HOME/encarmen-staging-backups/payload-enc-coord-9bd1eaba965f.tar.gz" && umask 077 && cat > "$HOME/encarmen-staging-backups/payload-enc-coord-9bd1eaba965f.tar.gz"' < staging-payload.tar.gz
          echo 'PRIVATE_STAGING_PAYLOAD_TRANSFERRED=PASS'
      - name: Respaldo selectivo y activación atómica de Staging
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 "bash -s -- '9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9' '$ENC_STAGING_EXPECTED_OLD_LINK'" < coordination/ops/staging-backups/deploy_staging_candidate.sh
      - name: Confirmar SHA por SSH y versión HTTP de Staging
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          test -n "$ENC_STAGING_EXPECTED_OLD_LINK"
          [[ "$ENC_STAGING_EXPECTED_OLD_LINK" =~ ^versions/[a-zA-Z0-9-]+$ ]]
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 "sh -s -- '$ENC_STAGING_EXPECTED_OLD_LINK'" <<'REMOTE'
          set -eu
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          test "$(readlink "$root/current")" = 'versions/enc-coord-9bd1eaba965f'
          test "$(cat "$root/current/nodejs/dist/encarmen-release.txt")" = '9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9'
          test -f "$root/$1/nodejs/server.js"
          echo 'STAGING_SSH_RELEASE_IDENTITY=PASS'
          REMOTE
          for n in 1 2 3 4 5; do
            http=$(curl --max-redirs 0 -sS -o /dev/null -w '%{http_code}' --max-time 15 https://staging.encarmen.org/ || true)
            marker=$(curl --max-redirs 0 -fsS --max-time 15 https://staging.encarmen.org/encarmen-release.txt || true)
            if [[ "$http" == 200 && "$marker" == '9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9' ]]; then
              echo 'STAGING_HTTP_RELEASE_VERIFIED=9bd1eaba965f82805fa8ba8f74bc6d04b1f7f9e9'
              exit 0
            fi
            echo "STAGING_CHECK=$n HTTP=$http SHA_MATCH=no"
            sleep 8
          done
          echo "::error::Staging HTTP did not confirm the exact approved SHA; rollback is required"
          exit 1
      - name: Rollback seguro si alguna comprobación falló
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PASSWORD" || ! -s "$HOME/.ssh/known_hosts" ]]; then
            echo 'ROLLBACK_REMOTE_NOT_REACHED'
            exit 0
          fi
          export SSHPASS="$SSH_PASSWORD"
          if [[ -z "${ENC_STAGING_EXPECTED_OLD_LINK:-}" ]]; then
            echo 'ROLLBACK_SOURCE_NOT_FROZEN'
            exit 0
          fi
          [[ "$ENC_STAGING_EXPECTED_OLD_LINK" =~ ^versions/[a-zA-Z0-9-]+$ ]]
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 "sh -s -- '$ENC_STAGING_EXPECTED_OLD_LINK'" <<'REMOTE'
          set -eu
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          target=$(readlink "$root/current" || true)
          if [ "$target" = 'versions/enc-coord-9bd1eaba965f' ]; then
            test -f "$root/$1/nodejs/server.js"
            swap="$root/.rollback-enc-coord-9bd1eaba965f"
            test ! -e "$swap" && test ! -L "$swap"
            ln -s "$1" "$swap"
            mv -Tf "$swap" "$root/current"
            mkdir -p "$root/current/nodejs/tmp"
            touch "$root/current/nodejs/tmp/restart.txt"
            echo 'ROLLBACK_TO_PREVIOUS_STAGING_VERSION=COMPLETE'
          else
            echo 'ROLLBACK_NOT_REQUIRED_NO_TARGET_SWITCH'
          fi
          REMOTE
