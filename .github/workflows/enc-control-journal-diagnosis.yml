name: ENC diagnose control journal staging
on:
  push:
    branches: [work/enc-control-journal-diagnosis-098]
    paths: [.github/workflows/enc-control-journal-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure read-only SSH diagnostic
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          umask 077; mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'bash -s' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          case "$(realpath "$root/current")" in "$root/versions/"*) ;; *) exit 2;; esac
          echo "CONTROL_DIAG_SSH_HOME=$HOME"
          echo "CONTROL_DIAG_SSH_UID=$(id -u)"
          echo "CONTROL_DIAG_RELEASE=$(cat "$root/current/nodejs/dist/encarmen-release.txt")"
          python3 - "$root" <<'PY'
          import pathlib,sys,os,hashlib
          root=pathlib.Path(sys.argv[1])
          for name,p in [('CANONICAL',root/'control-data/journal.json'),('RELEASE',root/'current/nodejs/dist/control-data/journal.json')]:
            print('CONTROL_DIAG_'+name+'_EXISTS='+str(p.exists()))
            if p.exists() and p.is_file():
              print('CONTROL_DIAG_'+name+'_SIZE='+str(p.stat().st_size))
              print('CONTROL_DIAG_'+name+'_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          for p in /proc/[0-9]*/cmdline; do
            pid="${p#/proc/}";pid="${pid%/cmdline}"
            [ -r "$p" ] || continue
            cmd="$(tr '\0' ' ' < "$p" 2>/dev/null || true)"
            case "$cmd" in *node*server.js*|*node*server.bundle.js*)
              echo "CONTROL_DIAG_NODE_PID=$pid"
              if [ -r "/proc/$pid/environ" ]; then
                home="$(tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null | sed -n 's/^HOME=//p' | head -1)"
                if [ -n "$home" ]; then
                  echo "CONTROL_DIAG_NODE_HOME=$home"
                  p="$home/domains/staging.encarmen.org/hbuilds/control-data/journal.json"
                  if [ -f "$p" ]; then
                    echo "CONTROL_DIAG_NODE_JOURNAL_EXISTS=true"
                    sha256sum "$p" | cut -d' ' -f1 | sed 's/^/CONTROL_DIAG_NODE_JOURNAL_SHA256=/'
                  else echo "CONTROL_DIAG_NODE_JOURNAL_EXISTS=false"; fi
                fi
              fi
              ;;
            esac
          done
          REMOTE
