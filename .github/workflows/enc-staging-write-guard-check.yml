name: ENCARMEN staging business permission read-only diagnosis
on:
  push:
    branches: [coord/staging-registration-write-safety-20261030]
    paths: [.github/workflows/enc-staging-write-guard-check.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Staging public reads and safe rejection of invalid write attempts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > ENC_STAGING_WRITE_GUARD_RESULT.txt
          import json,urllib.request,urllib.error,datetime
          base='https://staging.encarmen.org'
          print('CHECK_UTC='+datetime.datetime.now(datetime.timezone.utc).isoformat())
          def call(path,method='GET',body=None):
              payload=json.dumps(body).encode() if body is not None else None
              req=urllib.request.Request(base+path,data=payload,method=method,headers={'Content-Type':'application/json','Cache-Control':'no-cache','User-Agent':'ENCARMEN-Staging-Guard-Check'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:return resp.status,resp.read(2000000)
              except urllib.error.HTTPError as e:return e.code,e.read(4000)
              except Exception as e:return type(e).__name__,b''
          for path in ('/api/health','/api/database-status','/api/businesses','/api/businesses?hasWhatsapp=true','/api/businesses?hasPhone=true'):
              status,raw=call(path)
              print('GET_'+path+'='+str(status))
              if path=='/api/health' and status==200:
                  try:
                      health=json.loads(raw)
                      print('RUNTIME_ENVIRONMENT='+str(health.get('environment')))
                      print('RUNTIME_READ_ONLY='+str(health.get('staging',{}).get('readOnly')))
                      print('RUNTIME_WRITES_PERMITTED='+str(health.get('staging',{}).get('writesPermitted')))
                      print('RUNTIME_DB_ENGINE='+str(health.get('database')))
                  except Exception: print('RUNTIME_HEALTH_PARSE_ERROR=yes')
              if path=='/api/database-status' and status==200:
                  try:
                      status_obj=json.loads(raw)
                      business=status_obj.get('businessWrites',{})
                      isolation=status_obj.get('stagingIsolation',{})
                      print('BUSINESS_WRITES_CONFIGURED='+str(business.get('configured')))
                      print('BUSINESS_WRITES_PERMITTED='+str(business.get('permitted')))
                      print('BUSINESS_WRITE_SCOPE='+str(business.get('scope')))
                      print('ISOLATION_VALID='+str(isolation.get('isolationValid')))
                      print('IS_PRODUCTION_DB='+str(isolation.get('isProductionDb')))
                      print('DB_CONNECTED='+str(status_obj.get('mariadb',{}).get('connected')))
                  except Exception: print('DATABASE_STATUS_PARSE_ERROR=yes')
              if path.startswith('/api/businesses') and status==200:
                  try:
                      obj=json.loads(raw)
                      items=obj if isinstance(obj,list) else next((obj[k] for k in ('businesses','data','items') if isinstance(obj.get(k),list)),[])
                      print('COUNT_'+path+'='+str(len(items)))
                      if 'hasWhatsapp' in path:print('HAIR_PALACE_WHATSAPP_INCLUDED='+str(any('hair palace' in str(b.get('name','')).lower() for b in items if isinstance(b,dict))))
                  except Exception:print('COUNT_PARSE_ERROR=yes')
          print('READ_ONLY_DIAGNOSTIC_COMPLETE=yes')

          PY
          cat ENC_STAGING_WRITE_GUARD_RESULT.txt
      - name: Save redacted test results in isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ENC_STAGING_WRITE_GUARD_RESULT.txt || echo 'RESULT=FAILED_NO_OUTPUT' > ENC_STAGING_WRITE_GUARD_RESULT.txt
          git config user.name encarmen-guard-check
          git config user.email encarmen-guard-check@users.noreply.github.com
          git add ENC_STAGING_WRITE_GUARD_RESULT.txt
          git commit -m 'docs: record staging business guard checks' || exit 0
          git push origin HEAD:coord/staging-registration-write-safety-20261030
