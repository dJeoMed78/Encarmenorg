name: ENCARMEN staged admin automatic readonly login and revocation
# Nonsecret live Node environment comparison to identify admin-provider 503 condition.
on:
  push:
    branches: [coord/staging-admin-login-window-20261030]
    paths: [.github/workflows/enc-staging-readonly-admin-auto-e2e.yml]
permissions:
  contents: write
concurrency:
  group: encarmen-staging-admin-login-window
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated staging scripts
        run: |
          python3 -m py_compile ops/coord/staging_readonly_login_prepare.py
          python3 -m py_compile ops/coord/staging_readonly_login_restore.py
          python3 -m py_compile ops/coord/staging_readonly_login_auto_e2e.py
      - name: Staging-only credential, login, read-only guard and automatic revoke
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -u
          {
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -z "${SSHPASS:-}" ]; then echo RESULT=BLOCKED_NO_SSH; exit 0; fi
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -qq -y sshpass >/dev/null 2>&1
            umask 077
            mkdir -p "$HOME/.ssh"
            ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
            fp=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 2>/dev/null | awk '{print $2}')
            if [ "$fp" != 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4' ]; then echo RESULT=BLOCKED_SSH_PIN; exit 0; fi
            echo SSH_FINGERPRINT=VERIFIED
            export SSHPASS
            HOST=u293982346@45.137.159.114
            OPT=(-T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no)
            sshpass -e ssh "${OPT[@]}" "$HOST" 'umask 077; b="$HOME/encarmen-staging-backups/enc-admin-smoke"; test -d "$HOME/encarmen-staging-backups"; mkdir -p "$b"; test ! -L "$b"'
            for name in staging_readonly_login_prepare.py staging_readonly_login_restore.py staging_readonly_login_auto_e2e.py; do
              sshpass -e ssh "${OPT[@]}" "$HOST" "umask 077; cat > \"\$HOME/encarmen-staging-backups/enc-admin-smoke/$name\"" < "ops/coord/$name"
            done
            sshpass -e ssh "${OPT[@]}" "$HOST" 'python3 "$HOME/encarmen-staging-backups/enc-admin-smoke/staging_readonly_login_auto_e2e.py"'
            echo "SSH_EXIT=$?"
          } > ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt 2>&1
          cat ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt
          grep -q '^FINAL_RESULT=PASS_STAGING_ADMIN_LOGIN_SESSION_READONLY$' ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt
          grep -q '^SESSION_PROVIDER_REVOKED=true$' ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt
      - name: Emergency restore if temporary marker remains
        if: always()
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        shell: bash
        run: |
          set -u
          if [ -z "${SSHPASS:-}" ] || [ ! -s "$HOME/.ssh/known_hosts" ]; then exit 0; fi
          export SSHPASS
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'if test -f "$HOME/encarmen-staging-backups/enc-staging-readonly-admin-active.json"; then python3 "$HOME/encarmen-staging-backups/enc-admin-smoke/staging_readonly_login_restore.py"; else echo EMERGENCY_RESTORE_NOT_REQUIRED=true; fi' >> ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt 2>&1 || true
      - name: Publish nonsecret test evidence
        if: always()
        run: |
          set -euo pipefail
          test -s ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt || echo RESULT=NO_REPORT > ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt
          git config user.name encarmen-coordination
          git config user.email encarmen-coordination@users.noreply.github.com
          git add ENC_STAGING_READONLY_LOGIN_AUTO_E2E_RESULT.txt
          git commit -m 'docs: automatic staging admin HTTP read-only E2E with revoked credentials' || exit 0
          git push origin HEAD:coord/staging-admin-login-window-20261030
