name: ENCARMEN - Inspeccion de versiones Staging
on:
  push:
    branches: [coord/encarmen-work-control-001]
    paths: [.github/workflows/encarmen-staging-version-inspection.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_PASSWORD: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - name: Inspect readonly
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          umask 077; mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'sh -s' <<'REMOTE'
          set -eu
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          echo 'VERSIONS'; ls -lah "$root/versions"
          echo 'CURRENT'; ls -lah "$root/current"; ls -lah "$root/current/" | head -45
          echo 'CURRENT_FILES'; find -L "$root/current" -maxdepth 2 -type f \( -name server.js -o -name app.js -o -name package.json -o -name index.html \) -print | head -30
          echo 'LAST_SOURCE_GIT'; git -C "$root/last-source" rev-parse --short HEAD || true; git -C "$root/last-source" remote -v 2>/dev/null | sed -E 's#(https?://)[^/@]+@#\1***@#g' | head -5
          # Never expose .htaccess, .env, process arguments containing secrets or database credentials.
          echo 'ACTIVE_SYMLINK'; readlink "$root/current" || true
          echo 'RELEASE_MARKER'
          marker="$root/current/nodejs/dist/encarmen-release.txt"
          if [ -f "$marker" ]; then
            value=$(cat "$marker")
            if printf '%s' "$value" | grep -Eq '^[a-f0-9]{40}          echo 'PROCESS_METADATA'; ps -u "$(id -un)" -o comm,args | grep lsnode | grep staging.encarmen.org | cut -c1-230 | head -6 || true
          REMOTE
; then
              printf 'STAGING_MARKER_SHA=%s\\n' "$value"
            else
              echo 'STAGING_MARKER_STATUS=INVALID_FORMAT'
            fi
          else
            echo 'STAGING_MARKER_STATUS=NOT_PRESENT'
          fi
          # Existence of a configuration file is not proof of DB isolation.
          if [ -f "$root/config/.env" ]; then echo 'STAGING_CONFIG_FILE_PRESENT=yes'; else echo 'STAGING_CONFIG_FILE_PRESENT=no'; fi
          echo 'PROCESS_METADATA'; ps -u "$(id -un)" -o comm,args | grep lsnode | grep staging.encarmen.org | cut -c1-230 | head -6 || true
          REMOTE
