name: ENCARMEN - Inspeccion de versiones Staging
on:
  push:
    branches: [coord/encarmen-work-control-001]
    paths: [.github/workflows/encarmen-staging-version-inspection.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_PASSWORD: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - name: Inspeccion segura de identidad de release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'sh -s' <<'REMOTE'
          set -eu
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          test -L "$root/current"
          test -d "$root/versions"
          printf 'STAGING_ACTIVE_LINK=%s\n' "$(readlink "$root/current")"
          marker="$root/current/nodejs/dist/encarmen-release.txt"
          if [ -f "$marker" ]; then
            sha=$(cat "$marker")
            case "$sha" in
              *[!0123456789abcdef]*) echo STAGING_MARKER_STATUS=INVALID ;;
              *)
                if [ "${#sha}" -eq 40 ]; then
                  printf 'STAGING_RELEASE_SHA=%s\n' "$sha"
                else
                  echo STAGING_MARKER_STATUS=INVALID_LENGTH
                fi
                ;;
            esac
          else
            echo STAGING_MARKER_STATUS=NOT_PRESENT
          fi
          echo 'STAGING_COMPILED_VERSION'
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / 'domains/staging.encarmen.org/hbuilds/current/nodejs/dist'
          found = set()
          for asset in (root/'assets').glob('*.js'):
              try:
                  content = asset.read_text(encoding='utf-8',errors='replace')
              except OSError:
                  continue
              found.update(re.findall(r'(?<![a-zA-Z0-9])\\d{6}:\\d{4}:(?:[a-f0-9]{12}|SIN-SHA):H(?![a-zA-Z0-9])',content))
          if found:
              for stamp in sorted(found)[:4]:
                  print('STAGING_FRONTEND_STAMP='+stamp)
          else:
              print('STAGING_FRONTEND_STAMP=NOT_DETECTED')
          PY
          echo 'ACTIVE_INDEX_MTIME_EPOCH'
          stat -c '%Y' "$root/current/nodejs/dist/index.html"
          if [ -f "$root/config/.env" ]; then
            echo STAGING_CONFIG_FILE_PRESENT=yes
          else
            echo STAGING_CONFIG_FILE_PRESENT=no
          fi
          REMOTE
          curl -fsSL --max-time 15 https://staging.encarmen.org/encarmen-release.txt | head -c 45 || true
