name: ENC radars 041+043 authorized reversible staging deployment
# ENC-034 moderation-context PR #82: merge 56d6b7f7673845b829afd097172e8b0885fce81b; owner-authorized Staging deployment after CI PASS; no production; 2026-11-07.
# Deployment guard: allow Hostinger-managed release activation to settle before switching; require a stable current symlink and retain fail-closed compare-before-switch.
# ENC-034 authorized staging release: PR #80 comment-before-rating UX and PR #81 iOS Glass review toast; merges cd8854faafb908a9e569dc2cd4ac8e4787c3004d and d5855d4c8141aa4a9ab56e275e186a07254b43c5; owner-authorized Staging only 2026-11-07; preserve isolated DB backup and rollback.
# ENC-034 verified live: remove temporary gate diagnostic after real Staging SQL E2E PASS.
# Release only Staging; no private write flags, no production modification.
# Staging ONLY. main/production excluded; deployment keeps automatic rollback on failed HTTP.
on:
  push:
    branches: [ia-desarrollo]
    paths: [.github/workflows/enc-radars-041-043-staging-deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encarmen-authorized-staging-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: coordination
          ref: coord/encarmen-work-control-001
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Test build exact candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ia-desarrollo'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          npm run lint
          node --import tsx --test tests/enc-radar-classifieds-041.test.mjs tests/enc-staging-classified-lane-041.test.mjs
          npm run build
          ENCARMEN_EXPECTED_SHA="$GITHUB_SHA" node scripts/verify_footer_release.cjs
          test -f server.js && test -f api/server.bundle.js && test -f dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/encarmen-release.txt
          # Created only after SHA/build verification; deployed atomically with bundle.
          node -e 'const fs=require("node:fs");fs.writeFileSync("dist/encarmen-release.json",JSON.stringify({sha:process.env.GITHUB_SHA,updatedAt:new Date().toISOString()}))'
          node -e 'const d=require("./dist/encarmen-release.json");if(d.sha!==process.env.GITHUB_SHA||!Number.isFinite(Date.parse(d.updatedAt)))process.exit(1)'

          tar -czf ../enc041-payload.tar.gz server.js dist api/server.bundle.js
          gzip -t ../enc041-payload.tar.gz
      - name: Verify pinned SSH host identity
        id: pinned_host
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          umask 077; mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
      - name: Create fresh isolated Staging SQL backup before any deployment
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'python3 -' <<'PY'
          import gzip,os,pathlib,shutil,subprocess,tempfile,datetime
          home=pathlib.Path.home()
          root=home/'domains/staging.encarmen.org/hbuilds'
          config=root/'config/.env'
          backup=home/'encarmen-staging-backups'
          dbdir=backup/'database'
          if not config.is_file() or config.is_symlink() or config.stat().st_mode & 0o077:
              raise SystemExit('STAGING_CONFIG_NOT_PRIVATE')
          if backup.is_symlink() or dbdir.is_symlink() or not dbdir.is_dir() or dbdir.stat().st_mode & 0o077:
              raise SystemExit('STAGING_BACKUP_DIR_UNSAFE')
          vals={}
          for line in config.read_text().splitlines():
              line=line.strip().removeprefix('export ').strip()
              if not line or line.startswith('#') or '=' not in line: continue
              k,v=line.split('=',1);vals[k.strip()]=v.strip().strip('"').strip("'")
          db='u293982346_encarmentest'
          if vals.get('APP_ENV')!='staging' or vals.get('DB_NAME')!=db or vals.get('DB_USER')=='u293982346_appuser' or not all(vals.get(k) for k in ('DB_HOST','DB_USER','DB_PASSWORD')):
              raise SystemExit('STAGING_DB_IDENTITY_UNVERIFIED')
          cli=shutil.which('mariadb')
          dump=shutil.which('mariadb-dump') or shutil.which('mysqldump')
          if not cli or not dump:raise SystemExit('STAGING_DUMP_BINARY_MISSING')
          cnf=None;temp=None
          try:
              with tempfile.NamedTemporaryFile(mode='w',dir=backup,prefix='.radars-cnf-',delete=False) as f:
                  cnf=pathlib.Path(f.name);os.chmod(cnf,0o600)
                  f.write('[client]\n')
                  for k,v in (('host',vals['DB_HOST']),('port',vals.get('DB_PORT','3306')),('user',vals['DB_USER']),('password',vals['DB_PASSWORD'])):
                      f.write(k+'="'+str(v).replace('\\','\\\\').replace('"','\\"').replace('\n','')+'"\n')
              args=['--defaults-extra-file='+str(cnf)]
              check=subprocess.run([cli,*args,'--batch','--skip-column-names','-D',db,'-e','SELECT DATABASE(), CURRENT_USER()'],capture_output=True,text=True,timeout=30)
              if check.returncode or not check.stdout.strip().startswith(db+'\t') or 'u293982346_appuser' in check.stdout:
                  raise SystemExit('STAGING_SQL_IDENTITY_FAILED')
              stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S')
              dest=dbdir/('staging-db-enc-radars-'+stamp+'.sql.gz')
              with tempfile.NamedTemporaryFile(dir=dbdir,prefix='.radars-backup-',delete=False) as f:
                  temp=pathlib.Path(f.name);os.chmod(temp,0o600)
              with open(temp,'wb') as raw:
                  with gzip.GzipFile(fileobj=raw,mode='wb') as gz:
                      proc=subprocess.Popen([dump,*args,'--single-transaction','--quick','--skip-lock-tables','--databases',db],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                      shutil.copyfileobj(proc.stdout,gz)
                      proc.stdout.close()
                      _,err=proc.communicate(timeout=180)
                      if proc.returncode:raise SystemExit('STAGING_SQL_DUMP_FAILED')
              if temp.stat().st_size<100 or not gzip.open(temp,'rb').read(128):
                  raise SystemExit('STAGING_SQL_DUMP_EMPTY')
              temp.rename(dest);temp=None
              print('STAGING_FRESH_DB_BACKUP=VERIFIED')
          finally:
              if cnf:cnf.unlink(missing_ok=True)
              if temp:temp.unlink(missing_ok=True)
          PY
      - name: Verify backup baseline and deploy only staging
        run: |
          set -euo pipefail
          # Hostinger may finish its own hbuilds release activation after the Git push.
          # Wait for that external switch to settle before capturing the active baseline.
          echo "STAGING_WAITING_FOR_HOSTINGER_RELEASE_STABILITY=90s"
          sleep 90
          host=u293982346@45.137.159.114
          short=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no "$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          test -L "$root/current"
          test -d "$root/current/nodejs/node_modules"
          test -f "$root/current/nodejs/server.js"
          test -f "$root/current/nodejs/api/server.bundle.js"
          test -f "$root/current/nodejs/dist/index.html"
          case "$(readlink "$root/current")" in versions/*) ;; *) echo 'STAGING_RELEASE_PATH_INVALID'; exit 5;; esac
          test "$(stat -c %a "$HOME/encarmen-staging-backups/database")" = 700
          f=$(find "$HOME/encarmen-staging-backups/database" -maxdepth 1 -type f -name 'staging-db-*.sql.gz' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$f"
          gzip -t "$f"
          # Require recent staging DB backup and verified isolated private configuration.
          now=$(date +%s); modified=$(stat -c %Y "$f")
          test $((now - modified)) -le 86400 || { echo "STAGING_DB_BACKUP_TOO_OLD"; exit 6; }
          python3 - "$root/config/.env" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          if not p.is_file() or p.is_symlink() or p.stat().st_mode & 0o077: raise SystemExit('STAGING_PRIVATE_CONFIG_UNSAFE')
          vals={}
          for line in p.read_text().splitlines():
              if not line or line.lstrip().startswith('#') or '=' not in line: continue
              k,v=line.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          if vals.get('APP_ENV')!='staging' or vals.get('DB_NAME')!='u293982346_encarmentest' or vals.get('DB_USER')=='u293982346_appuser' or not vals.get('DB_PASSWORD'):
              raise SystemExit('STAGING_DB_ISOLATION_UNVERIFIED')
          print('STAGING_PRIVATE_DB_IDENTITY=VERIFIED')
          PY
          test -d "$HOME/encarmen-staging-backups/files"
          echo "ENC041_PREDEPLOY_BACKUP=PASS"
          REMOTE
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no "$host" "umask 077; cat > \"\$HOME/encarmen-staging-backups/payload-enc-coord-$short.tar.gz\"" < enc041-payload.tar.gz
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no "$host" 'umask 077; cat > "$HOME/encarmen-staging-backups/enc041-deploy.sh"; chmod 600 "$HOME/encarmen-staging-backups/enc041-deploy.sh"' < candidate/ops/staging-backups/deploy_staging_candidate_041_043.sh
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no "$host" "bash -s '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          previous=""
          stable=0
          for attempt in 1 2 3 4 5 6 7 8; do
            current=$(readlink "$root/current")
            if [ "$current" = "$previous" ]; then stable=$((stable+5)); else stable=0; previous="$current"; fi
            sleep 5
          done
          test "$stable" -ge 30 || { echo "STAGING_ACTIVE_RELEASE_NOT_STABLE"; exit 5; }
          echo "STAGING_ACTIVE_RELEASE_STABLE=yes"
          old=$(readlink "$root/current")
          bash "$HOME/encarmen-staging-backups/enc041-deploy.sh" "$sha" "$old"
          echo "ENC041_STAGING_SWITCH=PASS"
          REMOTE
      - name: Check exact SHA over staging HTTP
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 15 https://staging.encarmen.org/ || true)
            sha=$(curl -fsSL --max-time 15 https://staging.encarmen.org/encarmen-release.txt || true)
            manifest=$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' https://staging.encarmen.org/encarmen-release.json || true)
            if [[ "$code" = 200 && "$sha" = "$GITHUB_SHA" && -n "$manifest" ]] &&
                RELEASE_JSON="$manifest" node -e 'const d=JSON.parse(process.env.RELEASE_JSON);if(d.sha!==process.env.GITHUB_SHA||!Number.isFinite(Date.parse(d.updatedAt)))process.exit(1)'; then
              echo "ENCARMEN_STAGING_FOOTER_RELEASE_IDENTITY=PASS"
              exit 0
            fi
            sleep 7
          done
          exit 1
      - name: Restore prior staging release if required
        if: failure() && steps.pinned_host.conclusion == 'success'
        run: |
          set -u
          test -n "$SSHPASS" && test -f "$HOME/.ssh/known_hosts" || exit 0
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 "bash -s '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          short=$(printf '%s' "$sha" | cut -c1-12)
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          if [ "$(readlink "$root/current")" != "versions/enc-coord-$short" ]; then
            echo "ENC041_ROLLBACK_NOT_REQUIRED"
            exit 0
          fi
          manifest=$(find "$HOME/encarmen-staging-backups/files" -type f -name "enc-coord-$short.manifest" | head -1)
          test -n "$manifest"
          old=$(sed -n 's/^OLD_LINK=//p' "$manifest")
          case "$old" in versions/*) ;; *) exit 2;; esac
          test -f "$root/$old/nodejs/server.js"
          newlink="$root/.enc041-rollback-$$"
          test ! -e "$newlink" && test ! -L "$newlink"
          ln -s "$old" "$newlink"
          mv -Tf "$newlink" "$root/current"
          mkdir -p "$root/current/nodejs/tmp"
          touch "$root/current/nodejs/tmp/restart.txt"
          echo "ENC041_ROLLBACK=RESTORED"
          REMOTE
