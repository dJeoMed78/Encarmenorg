name: ENC-041 Staging SSH preflight read only
on:
  push:
    branches: [work/enc-radar-clasificados-041-nia]
    paths: [.github/workflows/enc-041-staging-ssh-preflight.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - name: Verify credential availability without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "STAGING_SSH_SECRET_UNAVAILABLE"; exit 2; }
          echo "STAGING_SSH_SECRET_PRESENT=yes"
      - name: Check pinned Hostinger SSH identity
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          fp=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')
          test "$fp" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4' || { echo "STAGING_SSH_FINGERPRINT_MISMATCH"; exit 3; }
          echo "STAGING_SSH_FINGERPRINT_VERIFIED=yes"
      - name: Inspect current staging and backup without changes
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o BatchMode=no -o ConnectTimeout=12 u293982346@45.137.159.114 'bash -s' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/staging.encarmen.org/hbuilds"
          test -d "$root" || { echo "STAGING_ROOT_MISSING"; exit 10; }
          test -L "$root/current" || { echo "STAGING_RELEASE_SYMLINK_MISSING"; exit 11; }
          release=$(readlink "$root/current")
          case "$release" in versions/*) ;; *) echo "STAGING_RELEASE_UNEXPECTED"; exit 12;; esac
          test -f "$root/current/nodejs/server.js" || { echo "STAGING_SERVER_BUNDLE_MISSING"; exit 13; }
          echo "STAGING_RELEASE_PATH_VALID=yes"
          if [ -f "$root/current/nodejs/dist/encarmen-release.txt" ]; then
            rev=$(head -c 80 "$root/current/nodejs/dist/encarmen-release.txt" | tr -cd 'a-fA-F0-9')
            echo "STAGING_BUNDLE_SHA=${rev:-unknown}"
          else
            echo "STAGING_BUNDLE_SHA=not_available"
          fi
          dir="$HOME/encarmen-staging-backups/database"
          test -d "$dir" && test ! -L "$dir" || { echo "STAGING_DB_BACKUP_DIR_MISSING"; exit 14; }
          mode=$(stat -c '%a' "$dir")
          test "$mode" = 700 || { echo "STAGING_DB_BACKUP_DIR_PERMISSION_INVALID"; exit 15; }
          file=$(find "$dir" -maxdepth 1 -type f -name 'staging-db-*.sql.gz' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          test -n "$file" && test -s "$file" || { echo "STAGING_DB_BACKUP_FILE_MISSING"; exit 16; }
          gzip -t "$file" || { echo "STAGING_DB_BACKUP_CORRUPT"; exit 17; }
          echo "STAGING_DB_BACKUP_ARCHIVE_VALID=yes"
          if [ -f "$root/config/.env" ]; then
            envmode=$(stat -c '%a' "$root/config/.env")
            if [ "$envmode" = 600 ]; then
              echo "STAGING_PRIVATE_ENV_PERMISSIONS=600"
              python3 - "$root/config/.env" <<'PY'
          import sys, re
          from pathlib import Path
          path = Path(sys.argv[1])
          values = {}
          duplicates = []
          for original in path.read_text(encoding='utf8').splitlines():
              line = re.sub(r'^export\s+', '', original.strip())
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key in values:
                  duplicates.append(key)
              values[key] = value.strip().strip('"').strip("'")
          db = values.get('DB_NAME', '')
          user = values.get('DB_USER', '')
          env = values.get('APP_ENV', '')
          print('STAGING_PRIVATE_DB_NAME_MATCH=' + ('yes' if db=='u293982346_encarmentest' else 'no'))
          print('STAGING_PRIVATE_DB_NAME_KEY_PRESENT=' + ('yes' if 'DB_NAME' in values else 'no'))
          print('STAGING_PRIVATE_DB_NAME_FORMAT=' + ('quoted' if any('DB_NAME=' in ln and ('"' in ln or "'" in ln) for ln in path.read_text(encoding='utf8').splitlines()) else 'plain_or_other'))
          print('STAGING_PRIVATE_APP_ENV_STAGING=' + ('yes' if env=='staging' else 'no'))
          print('STAGING_PRIVATE_DB_USER_IS_PRODUCTION=' + ('yes' if user=='u293982346_appuser' else 'no'))
          print('STAGING_PRIVATE_DB_USER_PRESENT=' + ('yes' if bool(user) else 'no'))
          print('STAGING_PRIVATE_CRITICAL_DUPLICATES=' + ('yes' if any(x in duplicates for x in ('DB_NAME','DB_USER','DB_PASSWORD','APP_ENV')) else 'no'))
          print('STAGING_PRIVATE_CLASSIFIED_GATE_PRESENT=' + ('yes' if 'STAGING_CLASSIFIED_WRITES_ENABLED' in values else 'no'))
          PY
            else
              echo "STAGING_PRIVATE_ENV_PERMISSIONS=unexpected"
            fi
          else
            echo "STAGING_PRIVATE_ENV_MISSING=yes"
          fi
          echo "ENC041_READONLY_PREFLIGHT_COMPLETE=yes"
          cd "$root/current/nodejs"
          node <<'NODE'
          const fs = require('fs');
          const mysql = require('mysql2/promise');
          const path = require('path');
          const configFile = path.join(process.env.HOME,'domains','staging.encarmen.org','hbuilds','config','.env');
          const values = {};
          for (const line of fs.readFileSync(configFile,'utf8').split(/\r?\n/)) {
            const item = line.trim().replace(/^export\s+/,'');
            if (!item || item.startsWith('#')) continue;
            const idx = item.indexOf('=');
            if (idx < 1) continue;
            values[item.slice(0,idx).trim()] = item.slice(idx+1).trim().replace(/^['"]|['"]$/g,'');
          }
          async function main() {
            if (values.APP_ENV !== 'staging' || values.DB_NAME !== 'u293982346_encarmentest' ||
                !values.DB_USER || values.DB_USER === 'u293982346_appuser' ||
                !values.DB_HOST || !values.DB_PASSWORD) throw Error('STAGING_DB_PRIVATE_CONFIG_REJECTED');
            console.log('ENC041_STAGING_DB_CONFIG_VALID=yes');
            console.log('ENC041_STAGING_READ_ONLY='+(values.STAGING_READ_ONLY === 'true'?'true':values.STAGING_READ_ONLY === 'false'?'false':'other'));
            console.log('ENC041_STAGING_DB_CONFIRMED='+(values.STAGING_DB_CONFIRMED === 'true'?'true':'not_true'));
            const db = await mysql.createConnection({
              host: values.DB_HOST, port: Number(values.DB_PORT || 3306),
              user: values.DB_USER, password: values.DB_PASSWORD,
              database: values.DB_NAME, connectTimeout: 12000
            });
            try {
              const [name] = await db.query('SELECT DATABASE() AS db_name, CURRENT_USER() AS current_user');
              if (name[0]?.db_name !== 'u293982346_encarmentest') throw Error('CONNECTED_TO_WRONG_DATABASE');
              console.log('ENC041_SQL_DATABASE_IDENTITY=staging_only');
              const [grants] = await db.query('SHOW GRANTS FOR CURRENT_USER()');
              const statements = grants.map(r=>String(Object.values(r)[0]||''));
              if (statements.length === 0 || statements.some(g=>g.includes('u293982346_encarmenapp')))
                throw Error('SQL_GRANTS_PRODUCTION_OR_UNKNOWN');
              console.log('ENC041_SQL_GRANTS_NO_EXPLICIT_PRODUCTION=yes');
              const [tables] = await db.query("SELECT ENGINE FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='classifieds'");
              console.log('ENC041_CLASSIFIEDS_INNODB='+(tables.length===1 && String(tables[0].ENGINE).toLowerCase()==='innodb'?'yes':'no'));
              const [pks] = await db.query("SELECT COLUMN_NAME,NON_UNIQUE,SEQ_IN_INDEX FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='classifieds' AND INDEX_NAME='PRIMARY'");
              console.log('ENC041_CLASSIFIEDS_PK_ID='+(pks.length===1 && pks[0].COLUMN_NAME==='id' && Number(pks[0].NON_UNIQUE)===0?'yes':'no'));
              const [count] = await db.query('SELECT COUNT(*) AS n FROM classifieds');
              console.log('ENC041_SQL_CLASSIFIEDS_READABLE=yes');
              console.log('ENC041_SQL_CLASSIFIEDS_COUNT='+Number(count[0]?.n||0));
            } finally { await db.end(); }
          }
          main().catch(e=>{ console.log('ENC041_SQL_PREFLIGHT_ERROR='+String(e.message||'UNKNOWN').replace(/[^A-Z0-9_]/gi,'_').slice(0,65));process.exitCode=1;});
          NODE
          REMOTE
