name: ENCARMEN controlled Staging business write test window
on:
  push:
    branches: [coord/staging-business-enable-20261030]
    paths: [.github/workflows/enc-staging-business-window.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation limited to Staging"
        type: choice
        options:
          - prepare
          - restore
        default: prepare
permissions:
  contents: write
jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute controlled Staging-only configuration change
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
          WINDOW_OPERATION: restore
        run: |
          set -u
          {
            echo 'ENCARMEN STAGING BUSINESS WINDOW'
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -z "$SSHPASS" ]; then echo RESULT=BLOCKED_MISSING_SSH_SECRET; exit 0; fi
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq sshpass >/dev/null 2>&1
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
            fp=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 2>/dev/null | awk '{print $2}')
            if [ "$fp" != 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4' ]; then echo RESULT=BLOCKED_SSH_PIN; exit 0; fi
            echo SSH_FINGERPRINT=VERIFIED
            if [ "$WINDOW_OPERATION" = restore ]; then
              script=ops/coord/staging_business_window_restore.py
            else
              script=ops/coord/staging_business_window_enable.py
            fi
            sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15 u293982346@45.137.159.114 'python3 -' < "$script"
            echo "SSH_EXIT=$?"
          } > ENC_STAGING_BUSINESS_WINDOW_RESULT.txt 2>&1
          cat ENC_STAGING_BUSINESS_WINDOW_RESULT.txt
      - name: Commit nonsecret execution proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ENC_STAGING_BUSINESS_WINDOW_RESULT.txt || echo RESULT=NO_REPORT > ENC_STAGING_BUSINESS_WINDOW_RESULT.txt
          git config user.name encarmen-coordination
          git config user.email encarmen-coordination@users.noreply.github.com
          git add ENC_STAGING_BUSINESS_WINDOW_RESULT.txt
          git commit -m 'docs: result of staging business-only window' || exit 0
          git push origin HEAD:coord/staging-business-enable-20261030
