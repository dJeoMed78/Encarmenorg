name: ENC-034 readonly Staging ratings schema audit
on:
  pull_request:
    branches: [work/enc-ratings-comments-034-w1]
    paths: [.github/workflows/enc-ratings-034-staging-schema-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - name: Confirm SSH access and pinned fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          umask 077; mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
      - name: Read-only database and schema identity (no DDL, DML, or business records)
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'python3 -' <<'PY'
          import pathlib,os,tempfile,subprocess,shutil
          home=pathlib.Path.home()
          root=home/'domains/staging.encarmen.org/hbuilds'
          config=root/'config/.env'
          backup=home/'encarmen-staging-backups'
          if not config.is_file() or config.is_symlink() or (config.stat().st_mode & 0o077):
              raise SystemExit('PRIVATE_CONFIG_NOT_VERIFIED')
          if not backup.is_dir() or backup.is_symlink() or (backup.stat().st_mode & 0o077):
              raise SystemExit('PRIVATE_BACKUP_NOT_VERIFIED')
          vals={}
          for original in config.read_text().splitlines():
              line=original.strip().removeprefix('export ').strip()
              if not line or line.startswith('#') or '=' not in line:continue
              k,v=line.split('=',1);vals[k.strip()]=v.strip().strip('"').strip("'")
          if vals.get('APP_ENV')!='staging' or vals.get('DB_NAME')!='u293982346_encarmentest' or vals.get('DB_USER')=='u293982346_appuser' or not all(vals.get(k) for k in ('DB_HOST','DB_USER','DB_PASSWORD')):
              raise SystemExit('STAGING_IDENTITY_REJECTED')
          if shutil.which('mariadb') is None:raise SystemExit('READONLY_CLIENT_MISSING')
          credential=None
          try:
              with tempfile.NamedTemporaryFile(mode='w',dir=backup,prefix='.enc034-readonly-',delete=False) as f:
                  credential=pathlib.Path(f.name);os.chmod(credential,0o600)
                  f.write('[client]\n')
                  for k,v in (('host',vals['DB_HOST']),('port',vals.get('DB_PORT','3306')),('user',vals['DB_USER']),('password',vals['DB_PASSWORD'])):
                      f.write(k+'="'+str(v).replace('\\','\\\\').replace('"','\\"').replace('\n','')+'"\n')
              def query(q):
                  p=subprocess.run(['mariadb','--defaults-extra-file='+str(credential),'--batch','--skip-column-names','-D','u293982346_encarmentest','-e',q],capture_output=True,text=True,timeout=25)
                  if p.returncode:raise RuntimeError('READ_ONLY_QUERY_FAILED')
                  return [x.split('\t') for x in p.stdout.strip().splitlines() if x.strip()]
              identity=query('SELECT DATABASE(),CURRENT_USER()')
              if len(identity)!=1 or identity[0][0]!='u293982346_encarmentest' or identity[0][1].split('@')[0]=='u293982346_appuser':
                  raise SystemExit('EFFECTIVE_IDENTITY_WRONG')
              grants=query('SHOW GRANTS FOR CURRENT_USER()')
              if any('u293982346_encarmenapp' in ' '.join(x) for x in grants):
                  raise SystemExit('PRODUCTION_GRANT_DETECTED')
              print('ENC034_STAGING_SQL_IDENTITY=VERIFIED')
              tables=query("SELECT TABLE_NAME,ENGINE FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('business_ratings','business_rating_moderation') ORDER BY TABLE_NAME")
              for name in ['business_ratings','business_rating_moderation']:
                  found=[x for x in tables if x[0]==name]
                  print('ENC034_TABLE_'+name.upper()+'='+('EXISTS_'+found[0][1] if found else 'MISSING'))
                  if found:
                      cols=query("SELECT COLUMN_NAME,COLUMN_TYPE,IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='"+name+"' ORDER BY ORDINAL_POSITION")
                      print('ENC034_COLUMNS_'+name.upper()+'='+','.join(c[0]+':'+c[1]+':'+c[2] for c in cols))
                      idx=query("SELECT INDEX_NAME,COLUMN_NAME,NON_UNIQUE,SEQ_IN_INDEX FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='"+name+"' ORDER BY INDEX_NAME,SEQ_IN_INDEX")
                      print('ENC034_INDEXES_'+name.upper()+'='+','.join(':'.join(r) for r in idx))
                      count=query('SELECT COUNT(*) FROM '+name)
                      print('ENC034_COUNT_'+name.upper()+'='+str(count[0][0]))
              print('ENC034_READONLY_AUDIT_COMPLETE=yes')
          finally:
              if credential:
                  try:credential.unlink()
                  except OSError:pass
          PY
