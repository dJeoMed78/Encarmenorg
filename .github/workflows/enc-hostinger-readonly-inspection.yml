name: ENCARMEN staging SSH read-only inspection
on:
  push:
    branches:
      - coord/enc-hostinger-readonly-inspection-001
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm available SSH secret without exposing it
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo 'SSH_SECRET_UNAVAILABLE'; exit 2; }
          echo 'SSH_SECRET_PRESENT=true'
      - name: Establish pinned host identity and run read-only checks
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -qq -y sshpass >/dev/null
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          found=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')
          expected='SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          test "$found" = "$expected" || { echo 'HOST_FINGERPRINT_MISMATCH'; exit 3; }
          echo 'HOST_FINGERPRINT=VERIFIED'
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o BatchMode=no -o ConnectTimeout=12 u293982346@45.137.159.114 'bash -s' <<'REMOTE'
          set -eu
          echo 'SSH_READ_ONLY_CONNECTED=true'
          for kind in staging prod; do
            case "$kind" in
              staging) root="$HOME/domains/staging.encarmen.org/hbuilds" ;;
              prod) root="$HOME/domains/encarmen.org" ;;
            esac
            if [ -d "$root" ]; then echo "${kind}_DIRECTORY_PRESENT=yes"; else echo "${kind}_DIRECTORY_PRESENT=no"; continue; fi
            if [ "$kind" = staging ]; then
              if [ -L "$root/current" ]; then echo 'staging_ACTIVE_RELEASE_SYMLINK=yes'; else echo 'staging_ACTIVE_RELEASE_SYMLINK=no'; fi
            fi
            for check in "$root" "$root/public_html" "$root/nodejs"; do
              if git -C "$check" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                b=$(git -C "$check" symbolic-ref --quiet --short HEAD 2>/dev/null || printf DETACHED)
                echo "${kind}_WORKTREE=yes BRANCH=$b"
                break
              fi
            done
          done
          echo 'SSH_INSPECTION_COMPLETE=true'
REMOTE
      - name: Explicit scope statement
        run: echo 'No database, builds, deploys, writes or service restarts were requested.'
