name: ENC DENUE 043 isolated validation
on:
  push:
    branches: [work/enc-radar-empresas-043-w1-denue-001]
  pull_request:
    branches: [ia-desarrollo]
    paths:
      - 'src/server/denueRadar.ts'
      - 'src/components/DenueBusinessRadar.tsx'
      - 'tests/denue-*.test.mjs'
      - '.github/workflows/enc-denue-043-ci.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - name: DENUE HTTP, simulated SQL and React
        run: node --import tsx --test tests/denue-radar.test.mjs tests/denue-radar-ui.test.mjs
      - name: Existing radar and isolation regressions
        env:
          NODE_ENV: test
        run: node --import tsx --test --test-force-exit tests/radar-business-approval.test.mjs tests/enc-radars-041-043-integration.test.mjs tests/enc-radar-classifieds-041.test.mjs tests/enc-staging-classified-lane-041.test.mjs tests/staging-isolation-proof.test.mjs
      - run: npm run build
