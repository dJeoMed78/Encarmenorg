name: ENCARMEN staging admin business deletion isolated regression CI
on:
  push:
    branches: [coord/enc-staging-business-delete-20261030]
    paths:
      - .github/workflows/enc-staging-delete-ci.yml
      - src/server/consolidatedWritePolicy.ts
      - src/db/stagingBusinessStore.ts
      - src/components/WordPressSyncModal.tsx
      - server.ts
      - tests/staging-write-001.test.mjs
      - tests/enc-staging-write-gate-005-unit.test.mjs
      - tests/enc-staging-write-gate-005-http.test.mjs
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install isolated jsdom test dependency (not shipped)
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Validate delete isolation, SQL readback and prior HTTP safety
        run: node --import tsx --test tests/staging-write-001.test.mjs tests/staging-store-default-strict.test.mjs tests/enc-staging-write-gate-005-unit.test.mjs tests/enc-staging-write-gate-005-http.test.mjs tests/staging-isolation-proof.test.mjs tests/security-containment-003.test.mjs
      - run: npm run build
