name: ENCARMEN radars 041+043 isolated integration
on:
  push:
    branches:
      - work/enc-radars-041-043-integration-nia
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Radar business handler and lock tests (mock DB)
        run: node --import tsx --test tests/radar-business-approval.test.mjs tests/enc-radars-041-043-integration.test.mjs
      - name: Real classified handler tests (mock DB)
        run: node --import tsx --test tests/enc-radar-classifieds-041.test.mjs tests/enc-staging-classified-lane-041.test.mjs
      - name: Staging safety regression tests (no real writes)
        run: node --import tsx --test tests/enc-staging-write-gate-005-unit.test.mjs tests/enc-staging-write-gate-005-http.test.mjs tests/staging-isolation-proof.test.mjs tests/security-containment-003.test.mjs
      - name: Build
        run: npm run build
