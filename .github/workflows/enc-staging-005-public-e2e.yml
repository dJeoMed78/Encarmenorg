              check(any(('UPDATE' in g or 'ALL PRIVILEGES' in g) and D in g for g in grants),'NO_UPDATE')
              check(any(('DELETE' in g or 'ALL PRIVILEGES' in g) and D in g for g in grants),'NO_CLEANUP_PERMISSION')
              print('SQL_IDENTITY_MARKER_GRANTS=STAGING_ONLY_VERIFIED',flush=True)
              folder=B/'database';check(folder.is_dir() and not folder.is_symlink(),'BACKUP_DATABASE_DIR_MISSING')
              stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
              archive=folder/('staging-db-005-pre-e2e-'+stamp+'.sql.gz')
              fd,out=tempfile.mkstemp(dir=folder,prefix='.enc-temp-snapshot-',suffix='.sql.gz')
              try:
                  with os.fdopen(fd,'wb') as raw:
                      with gzip.GzipFile(fileobj=raw,mode='wb') as gz:
                          p=subprocess.run(['mariadb-dump','--defaults-extra-file='+config,'--single-transaction','--quick','--skip-lock-tables','--no-tablespaces','--databases',D],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=120)
                          check(p.returncode==0 and len(p.stdout)>1000,'FULL_SQL_DUMP_FAILED')
                          gz.write(p.stdout)
                  with gzip.open(out,'rb') as gz:
                      dump=gz.read()
                      check(b'CREATE TABLE' in dump and b'businesses' in dump,'SQL_DUMP_INVALID')
                  os.replace(out,archive);os.chmod(archive,0o600)
              finally:
                  if os.path.exists(out):os.unlink(out)
              print('FRESH_SQL_SNAPSHOT=VERIFIED',flush=True)
          finally:
              os.unlink(config)
          print('PREFLIGHT=PASS_NO_WRITES',flush=True)
          PY
