name: ENCARMEN 005 Staging real HTTP SQL proof with emergency closure
on:
  push:
    branches: [coord/enc-staging-005-e2e-20261030]
    paths: [.github/workflows/enc-staging-005-public-e2e.yml]
permissions:
  contents: read
concurrency:
  group: encarmen-staging-runtime-deploy
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SSHPASS: \${{ secrets.ENC_STAGING_SSH_PASSWORD }}
