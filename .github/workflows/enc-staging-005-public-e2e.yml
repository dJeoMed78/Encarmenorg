          grep -q '^PUBLIC_READBACK=VERIFIED$' /tmp/enc-005-e2e.log
          grep -q '^SYNTHETIC_CLEANUP=VERIFIED$' /tmp/enc-005-e2e.log
          grep -q '^PRIVATE_CONFIG_RESTORED=VERIFIED$' /tmp/enc-005-e2e.log
          grep -q '^FINAL_RESULT=PASS_PUBLIC_CREATE_EDIT_SQL$' /tmp/enc-005-e2e.log
