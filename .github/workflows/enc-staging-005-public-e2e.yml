      - uses: actions/checkout@v4
      - name: Establish pinned Hostinger Staging SSH access
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${SSHPASS:-}"
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -qq -y sshpass >/dev/null 2>&1
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          fp=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')
          test "$fp" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          chmod 600 "$HOME/.ssh/known_hosts"
          echo SSH_FINGERPRINT=VERIFIED
      - name: Transfer fixed synthetic-only test script
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 u293982346@45.137.159.114 'umask 077; test -d "$HOME/encarmen-staging-backups" && cat > "$HOME/encarmen-staging-backups/enc-005-safe-public-e2e.py"' < ops/coord/staging_005_safe_public_e2e.py
          echo TEST_SCRIPT_TRANSFER=VERIFIED
      - name: Verify managed release and create fresh SQL snapshot before test
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 u293982346@45.137.159.114 'python3 -' <<'PY'
