        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 u293982346@45.137.159.114 'python3 -u "$HOME/encarmen-staging-backups/enc-005-safe-public-e2e.py"' | tee /tmp/enc-005-e2e.log
