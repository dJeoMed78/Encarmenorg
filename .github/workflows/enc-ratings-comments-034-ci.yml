name: ENC-034 moderated comments independent gate
on:
  pull_request:
    branches: [ia-desarrollo, work/enc-ratings-comments-034-w1]
    paths:
      - src/db/ratingModeration.ts
      - src/db/stagingRatingWrite.ts
      - tests/ratings-mariadb-034.integration.test.mjs
      - src/server/stagingBusinessSecurity.ts
      - tests/staging-ratings-write-034.test.mjs
      - src/db/mariadb.ts
      - src/components/BusinessComments.tsx
      - src/components/BusinessPublicDetail.tsx
      - src/components/StarRatingWidget.tsx
      - src/utils/realRatings.ts
      - src/server/adminSecurity.ts
      - server.ts
      - tests/ratings-moderation-034.test.mjs
      - .github/workflows/enc-ratings-comments-034-ci.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: enc034_ephemeral
          MARIADB_USER: enc034_test
          MARIADB_PASSWORD: local-ci-test-only
          MARIADB_ROOT_PASSWORD: local-ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Install pinned test-only browser dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright@1.56.1
      - name: TypeScript
        run: npm run lint
      - name: Moderation and ratings suites
        run: NODE_ENV=test node --import tsx --test tests/ratings-moderation-034.test.mjs tests/staging-ratings-write-034.test.mjs tests/ratings-034.test.mjs tests/ratings-hook-034.test.mjs tests/ratings-repository-034.test.mjs tests/ratings-routes-034.test.mjs
      - name: Real MariaDB (ephemeral GitHub runner; no Hostinger)
        env:
          ENC034_EPHEMERAL_DB_TEST: 'true'
          ENC034_TEST_DB_HOST: 127.0.0.1
          ENC034_TEST_DB_NAME: enc034_ephemeral
        run: NODE_ENV=test node --import tsx --test tests/ratings-mariadb-034.integration.test.mjs
      - name: Install Chromium for responsive test
        run: npx playwright install chromium --with-deps
      - name: Prepare isolated Vite assets for Chromium
        run: npx vite build --outDir /tmp/034-dist
      - name: Responsive Chromium verification
        run: NODE_ENV=test node --test tests/ratings-browser-034.test.mjs
      - name: Compile
        run: npm run build
