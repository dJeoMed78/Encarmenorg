name: Validate FreeLLMAPI isolated snapshot
on:
  push:
    branches:
      - experiment/freellmapi-evaluation-20261116
    paths:
      - .github/workflows/validate-freellmapi.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/freellmapi/upstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/freellmapi/upstream/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run automated tests
        run: |
          npm run test:bootstrap
          npm run test:hooks
          npm run test -w server
          # The CLI has no Vitest config; prevent Vitest from loading ENCARMEN's root vite.config.ts.
          printf 'export default { test: { root: "." } };\n' > cli/vitest.isolated.config.mjs
          (cd cli && npx vitest run --config vitest.isolated.config.mjs)
          cd client
          npx vitest run --config vite.config.ts
          npm run check:i18n
      - name: Compile project
        run: npm run build
