name: ENC-064 Staging footer release identity CI
on:
  pull_request:
    branches: [ia-desarrollo]
    paths:
      - server.ts
      - src/components/Footer.tsx
      - tests/enc-staging-footer-064.test.mjs
      - .github/workflows/enc-radars-041-043-staging-deploy.yml
      - .github/workflows/enc-staging-footer-064-ci.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: NODE_ENV=test node --import tsx --test tests/enc-staging-footer-064.test.mjs tests/enc-radar-classifieds-041.test.mjs tests/enc-staging-classified-lane-041.test.mjs
      - run: npm run build
      - run: ENCARMEN_EXPECTED_SHA="$GITHUB_SHA" node scripts/verify_footer_release.cjs
