name: ENCARMEN - restaurar WhatsApp Hair Palace solo Staging
on:
  push:
    branches: [coord/staging-hair-contact-fix-20261030]
    paths: [.github/workflows/enc-staging-hair-contact-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: SSH: identidad MariaDB, respaldo, cambio condicional y lectura posterior
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -u
          REPORT="$RUNNER_TEMP/enc-staging-hair-fix.txt"
          {
            echo 'ENCARMEN STAGING SINGLE-ROW WHATSAPP REPAIR'
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -z "$SSHPASS" ]; then echo 'RESULT=BLOCKED_MISSING_SSH_SECRET'; exit 0; fi
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq sshpass >/dev/null 2>&1
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
            FP=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 2>/dev/null | awk '{print $2}')
            if [ "$FP" != 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4' ]; then echo 'RESULT=BLOCKED_HOST_PIN'; exit 0; fi
            echo 'SSH_FINGERPRINT=VERIFIED'
            sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15 u293982346@45.137.159.114 'python3 -' <<'REMOTE'
          import pathlib, re, os, tempfile, subprocess, datetime, gzip, hashlib, json, urllib.parse, sys
          HOME=pathlib.Path.home()
          ENV=HOME/'domains/staging.encarmen.org/hbuilds/config/.env'
          ROOT=HOME/'encarmen-staging-backups'
          DB='u293982346_encarmentest'
          PROD='u293982346_encarmenapp'
          EXPECTED='9381458462'
          def output(k,v): print(f'{k}={v}',flush=True)
          def abort(s):output('RESULT','BLOCKED_'+s);sys.exit(0)
          if not ENV.is_file() or ENV.is_symlink():abort('ENV_MISSING')
          if not ROOT.is_dir() or ROOT.is_symlink() or ROOT.stat().st_mode&0o077:abort('PRIVATE_BACKUP')
          vals={}
          for line in ENV.read_text(encoding='utf-8').splitlines():
              line=line.strip()
              if line.startswith('export '):line=line[7:]
              if not line or line.startswith('#') or '=' not in line:continue
              key,val=line.split('=',1)
              vals.setdefault(key.strip(),[]).append(val.strip().strip('"').strip("'"))
          def get(*names):
              arr=[v for n in names for v in vals.get(n,[]) if v]
              return arr[0] if arr and len(set(arr))==1 else ''
          if get('APP_ENV')!='staging' or get('STAGING_READ_ONLY')!='true':abort('ENV_NOT_SAFE')
          if get('DB_NAME','MYSQL_DATABASE','MARIADB_DATABASE')!=DB:abort('DB_TARGET')
          user=get('DB_USER','MYSQL_USER','MARIADB_USER')
          host=get('DB_HOST','MYSQL_HOST','MARIADB_HOST')
          password=get('DB_PASSWORD','MYSQL_PASSWORD','MARIADB_PASSWORD')
          port=get('DB_PORT','MYSQL_PORT','MARIADB_PORT') or '3306'
          if not user or user=='u293982346_appuser' or not host or not password or not port.isdigit():abort('CREDENTIAL_CONFIG')
          config=None
          try:
              with tempfile.NamedTemporaryFile(mode='w',dir=ROOT,prefix='.enc-staging-only-',delete=False,encoding='utf-8') as f:
                  config=pathlib.Path(f.name)
                  config.chmod(0o600)
                  f.write('[client]\n')
                  for k,v in [('host',host),('port',port),('user',user),('password',password)]:
                      f.write(k+'="'+v.replace('\\','\\\\').replace('"','\\"').replace(chr(10),'')+'"\n')
              cmd=['mariadb','--defaults-extra-file='+str(config),'--batch','--skip-column-names','-D',DB]
              def sql(stmt):
                  r=subprocess.run(cmd+['-e',stmt],capture_output=True,text=True,timeout=50)
                  if r.returncode:abort('SQL_COMMAND_FAILED')
                  return r.stdout.strip().splitlines()
              who=sql('SELECT DATABASE(), SUBSTRING_INDEX(CURRENT_USER(),CHAR(64),1)')
              if len(who)!=1 or who[0].split('\t')[0]!=DB or who[0].split('\t')[1]=='u293982346_appuser':abort('SERVER_DB_IDENTITY')
              output('DATABASE_IDENTITY','STAGING_ONLY_CONFIRMED')
              data=sql("SELECT HEX(id),HEX(COALESCE(whatsapp,'')),HEX(COALESCE(raw_data,'')),HEX(COALESCE(phone,'')) FROM businesses WHERE LOWER(name) LIKE '%hair palace%keratin%'")
              if len(data)!=1:abort('MATCH_NOT_UNIQUE')
              parts=data[0].split('\t')
              if len(parts)!=4:abort('ROW_READBACK_SHAPE')
              bid,old,raw,telephone=[bytes.fromhex(x).decode('utf-8') for x in parts]
              if old==EXPECTED:
                  output('RESULT','ALREADY_CORRECT')
                  sys.exit(0)
              # Accept only a genuine WhatsApp URL with this same destination.
              try:
                  u=urllib.parse.urlparse(old.strip())
                  if u.scheme!='https' or u.hostname not in ('api.whatsapp.com','wa.me','www.whatsapp.com'):abort('UNTRUSTED_CONTACT_URL')
                  num=(urllib.parse.parse_qs(u.query).get('phone') or [u.path.strip('/').split('/')[0]])[0]
                  digits=re.sub(r'\D','',num)
                  if digits.startswith('521') and len(digits)==13:digits=digits[3:]
                  elif digits.startswith('52') and len(digits)==12:digits=digits[2:]
                  if digits!=EXPECTED:abort('CONTACT_NUMBER_MISMATCH')
              except Exception:abort('CONTACT_PARSE')
              doc=None
              if raw:
                  try:doc=json.loads(raw)
                  except Exception:abort('RAW_DATA_INVALID_JSON')
                  if not isinstance(doc,dict):abort('RAW_DATA_NOT_OBJECT')
                  prior=doc.get('whatsapp')
                  if prior not in (None,'',old):abort('RAW_DATA_CONTACT_DIFFERS')
                  doc['whatsapp']=EXPECTED
              # Full staging database backup before one-row mutation; keep all bytes private.
              folder=ROOT/'database'
              if not folder.is_dir() or folder.is_symlink() or folder.stat().st_mode&0o077:abort('BACKUP_DATABASE_DIR')
              timestamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
              dest=folder/('staging-precontact-'+timestamp+'.sql.gz')
              dump=['mariadb-dump','--defaults-extra-file='+str(config),'--single-transaction','--quick','--skip-lock-tables','--no-tablespaces','--default-character-set=utf8mb4',DB]
              tmp=None
              try:
                  fd,t=tempfile.mkstemp(prefix='.staging-precontact-',dir=folder)
                  tmp=pathlib.Path(t)
                  os.chmod(tmp,0o600)
                  with os.fdopen(fd,'wb') as output_stream:
                      d=subprocess.run(dump,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=240)
                      if d.returncode or b'CREATE TABLE' not in d.stdout:abort('DUMP_FAILURE')
                      with gzip.GzipFile(fileobj=output_stream,mode='wb',mtime=0) as gz:gz.write(d.stdout)
                      output_stream.flush();os.fsync(output_stream.fileno())
                  with gzip.open(tmp,'rb') as inp:
                      if b'CREATE TABLE' not in inp.read(200000):abort('DUMP_INTEGRITY')
                  os.replace(tmp,dest)
                  tmp=None
                  digest=hashlib.sha256(dest.read_bytes()).hexdigest()
                  (folder/(dest.name+'.sha256')).write_text(digest+'  '+dest.name+'\n')
                  os.chmod(folder/(dest.name+'.sha256'),0o600)
              finally:
                  if tmp and tmp.exists():tmp.unlink()
              output('PRECHANGE_BACKUP','CREATED_AND_VERIFIED')
              output('PRECHANGE_BACKUP_SHA256',digest)
              def hx(s):return "CONVERT(0x"+s.encode('utf-8').hex()+" USING utf8mb4)"
              # Update guarded by exact previous value and ID; readback from MariaDB authoritative.
              upd="UPDATE businesses SET whatsapp="+hx(EXPECTED)+(",raw_data="+hx(json.dumps(doc,ensure_ascii=False)) if doc is not None else '')+" WHERE id="+hx(bid)+" AND BINARY whatsapp=BINARY "+hx(old)+";"
              outcome=sql(upd+' SELECT ROW_COUNT();')
              if not outcome or outcome[-1]!='1':abort('CONDITIONAL_UPDATE_NOT_ONE_ROW')
              verify=sql('SELECT HEX(COALESCE(whatsapp,\'\')), HEX(COALESCE(raw_data,\'\')) FROM businesses WHERE id='+hx(bid))
              if len(verify)!=1 or bytes.fromhex(verify[0].split('\t')[0]).decode('utf-8')!=EXPECTED:abort('READBACK_MISMATCH')
              if doc is not None:
                  d2=json.loads(bytes.fromhex(verify[0].split('\t')[1]).decode('utf-8'))
                  if d2.get('whatsapp')!=EXPECTED:abort('RAW_DATA_READBACK')
              output('RESULT','UPDATED_AND_READBACK_VERIFIED')
          finally:
              if config and config.exists():config.unlink()
          REMOTE
            echo "SSH_COMMAND_EXIT_STATUS=$?"
          } > "$REPORT" 2>&1
          cat "$REPORT"
          cp "$REPORT" ENC_STAGING_HAIR_FIX_RESULT.txt
      - name: Persistir únicamente resultado no confidencial
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ENC_STAGING_HAIR_FIX_RESULT.txt ]; then echo 'RESULT=NO_REPORT' > ENC_STAGING_HAIR_FIX_RESULT.txt; fi
          git config user.name encarmen-staging-contact-repair
          git config user.email encarmen-staging-contact-repair@users.noreply.github.com
          git add ENC_STAGING_HAIR_FIX_RESULT.txt
          git commit -m 'docs: resultado reparación controlada Hair Palace staging' || exit 0
          git push origin HEAD:coord/staging-hair-contact-fix-20261030
