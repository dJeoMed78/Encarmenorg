name: Node.js CI Build (Hostinger Production)

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install, lint, test SEO controls, and build
        run: |
          npm ci
          # Full-project tsc --noEmit is currently blocked by an unchanged baseline error in AdminEventsTab.tsx:1499.
          node --import tsx --test tests/enc-seo-indexing-production.test.mjs
          npm run build --if-present