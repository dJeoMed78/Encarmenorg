name: ENCARMEN controlled public Staging business HTTP E2E stable DB gate
# Re-run after 2026-10-30 staging-only credential gate loader deployment.
# Diagnose test-only admin config presence without disclosing secret values.
on:
  push:
    branches: [coord/staging-public-e2e-20261030]
    paths: [.github/workflows/enc-staging-public-e2e.yml]
permissions:
  contents: write
concurrency:
  group: encarmen-staging-public-business-e2e
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Validate test script without remote effects
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/coord/staging_public_http_e2e.py
          python3 -m py_compile ops/coord/staging_business_window_enable.py
          python3 -m py_compile ops/coord/staging_business_window_restore.py
      - name: Stage guarded scripts in nonpublic Staging backup directory
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          umask 077; mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          fp=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')
          test "$fp" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
          export SSHPASS
          HOST=u293982346@45.137.159.114
          OPT=(-T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no)
          sshpass -e ssh "${OPT[@]}" "$HOST" 'set -eu; b="$HOME/encarmen-staging-backups"; test -d "$b"; test ! -L "$b"; umask 077; mkdir -p "$b/enc-public-e2e-scripts"; test ! -L "$b/enc-public-e2e-scripts"'
          for name in staging_public_http_e2e.py staging_business_window_enable.py staging_business_window_restore.py; do
            sshpass -e ssh "${OPT[@]}" "$HOST" "umask 077; cat > \"\$HOME/encarmen-staging-backups/enc-public-e2e-scripts/$name\"" < "ops/coord/$name"
          done
      - name: Public HTTP create/edit/readback and automatic rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -u
          export SSHPASS
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'python3 "$HOME/encarmen-staging-backups/enc-public-e2e-scripts/staging_public_http_e2e.py"' > ENC_STAGING_PUBLIC_E2E_RESULT.txt 2>&1
          echo "SSH_EXIT=$?" >> ENC_STAGING_PUBLIC_E2E_RESULT.txt
          cat ENC_STAGING_PUBLIC_E2E_RESULT.txt
          grep -q '^FINAL_RESULT=PASS_PUBLIC_HTTP_CREATE_EDIT_SQL_GET$' ENC_STAGING_PUBLIC_E2E_RESULT.txt
          grep -q '^SYNTHETIC_CLEANUP=VERIFIED$' ENC_STAGING_PUBLIC_E2E_RESULT.txt
          grep -q '^PUBLIC_READONLY_RESTORED=true$' ENC_STAGING_PUBLIC_E2E_RESULT.txt
      - name: Emergency recovery if business-write marker remains
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
        run: |
          set -u
          if [ -z "${SSHPASS:-}" ] || [ ! -s "$HOME/.ssh/known_hosts" ]; then exit 0; fi
          export SSHPASS
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'sh -s' <<'REMOTE' >> ENC_STAGING_PUBLIC_E2E_RESULT.txt 2>&1
          set -eu
          b="$HOME/encarmen-staging-backups"
          marker="$b/enc-staging-business-window-active.json"
          if [ -f "$marker" ] && [ ! -L "$marker" ]; then
            python3 "$b/enc-public-e2e-scripts/staging_business_window_restore.py"
            stage="$HOME/domains/staging.encarmen.org/hbuilds/current/nodejs"
            test -d "$stage/tmp"
            touch "$stage/tmp/restart.txt"
            echo EMERGENCY_RESTORE_TRIGGERED=true
          else
            echo EMERGENCY_RESTORE_NOT_REQUIRED=true
          fi
          REMOTE
      - name: Save redacted evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ENC_STAGING_PUBLIC_E2E_RESULT.txt || echo FINAL_RESULT=NO_EXECUTION_REPORT > ENC_STAGING_PUBLIC_E2E_RESULT.txt
          git config user.name encarmen-coordination
          git config user.email encarmen-coordination@users.noreply.github.com
          git add ENC_STAGING_PUBLIC_E2E_RESULT.txt
          git commit -m 'docs: controlled public Staging business HTTP SQL E2E result' || exit 0
          git push origin HEAD:coord/staging-public-e2e-20261030
