name: ENC-062 real isolated Staging MariaDB persistence proof
on:
  pull_request:
    branches: [ia-desarrollo]
    paths:
      - .github/workflows/enc-classified-062-real-sql-proof.yml
      - scripts/enc-041-staging-real-sql-proof.py
permissions:
  contents: read
concurrency:
  group: enc-062-staging-real-sql-isolated
  cancel-in-progress: false
jobs:
  prove-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate existing tested proof script
        run: python3 -m py_compile scripts/enc-041-staging-real-sql-proof.py
      - name: Verify SSH identity (pinned) and Staging-only access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "ENC062_SSH_SECRET_NOT_AVAILABLE"; exit 2; }
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4' || { echo "ENC062_SSH_HOST_IDENTITY_CHANGED"; exit 3; }
          echo "ENC062_SSH_IDENTITY=VERIFIED"
      - name: Read-only verify dedicated classifieds approval lane configuration
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o BatchMode=no -o ConnectTimeout=12 u293982346@45.137.159.114 'python3 -' <<'PY'
          import pathlib,os
          root=pathlib.Path.home()/'domains/staging.encarmen.org/hbuilds'
          env=root/'config/.env'
          if not env.is_file() or env.is_symlink() or env.stat().st_mode & 0o077:
              raise SystemExit('STAGING_CONFIG_UNSAFE')
          vals={}
          for line in env.read_text().splitlines():
              line=line.strip().removeprefix('export ').strip()
              if line and not line.startswith('#') and '=' in line:
                  k,v=line.split('=',1);vals[k.strip()]=v.strip().strip('"').strip("'")
          if vals.get('APP_ENV')!='staging' or vals.get('DB_NAME')!='u293982346_encarmentest':
              raise SystemExit('STAGING_ENV_IDENTITY_FAILED')
          # This reports only boolean readiness; never expose private authorization material.
          required=('ENC_STAGING_CLASSIFIED_WRITES_ENABLED','ENC_STAGING_CLASSIFIED_WRITES_APPROVED')
          for key in required:
              print(key+'=' + ('PRESENT' if vals.get(key) else 'MISSING'))
          PY
      - name: Isolated staging SQL transaction, readback and exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_BASE_REF" = 'ia-desarrollo' || exit 4
          test "$GITHUB_HEAD_REF" = 'work/enc-classifieds-review-gate-062-nia' || exit 4
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o BatchMode=no -o ConnectTimeout=12 u293982346@45.137.159.114 'ENC041_REAL_SQL_PROOF=AUTHORIZED_STAGING_ONLY python3 -' < scripts/enc-041-staging-real-sql-proof.py
