name: ENC041 temporary classified-only staging approval window
on:
  push:
    branches: [work/enc-radar-clasificados-041-nia]
    paths: [.github/workflows/enc-041-staging-classified-window.yml]
permissions:
  contents: read
concurrency:
  group: enc-041-classified-window
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.ENC_STAGING_SSH_PASSWORD }}
    steps:
      - name: Verify known SSH host identity
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          umask 077; mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p 65002 -t ed25519 45.137.159.114 2>/dev/null > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:EwoMB0mPfyo/zdh/+Fq7KAj6jsb80mEJB/UaqTK8E+4'
      - name: Activate scoped window with verified backup and atomic private config
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no u293982346@45.137.159.114 'python3 -' <<'PY'
          import datetime as dt
          import gzip
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import tempfile
          root=Path.home()/'domains/staging.encarmen.org/hbuilds'
          config=root/'config/.env'
          backup=Path.home()/'encarmen-staging-backups'
          data_dir=backup/'database'
          if not root.is_dir() or not (root/'current').is_symlink():raise SystemExit('STAGING_RELEASE_INVALID')
          version=(root/'current/nodejs/dist/encarmen-release.txt').read_text().strip()
          if version!='ad88107895ba98745fe884dcbe8113f391176457':raise SystemExit('STAGING_SHA_UNEXPECTED')
          if not config.is_file() or config.is_symlink() or config.stat().st_mode & 0o077:raise SystemExit('STAGING_CONFIG_INSECURE')
          if not backup.is_dir() or backup.is_symlink() or backup.stat().st_mode & 0o077:raise SystemExit('BACKUP_ROOT_INVALID')
          if not data_dir.is_dir() or data_dir.is_symlink() or data_dir.stat().st_mode & 0o077:raise SystemExit('BACKUP_DIR_INVALID')
          lines=config.read_text(encoding='utf8').splitlines()
          settings={}
          for line in lines:
              x=line.strip().removeprefix('export ').strip()
              if not x or x.startswith('#') or '=' not in x:continue
              key,value=x.split('=',1)
              if key in settings:raise SystemExit('STAGING_CONFIG_DUPLICATE_KEY')
              settings[key.strip()]=value.strip().strip('"').strip("'")
          if settings.get('APP_ENV')!='staging' or settings.get('DB_NAME')!='u293982346_encarmentest' or settings.get('DB_USER') in ('',None,'u293982346_appuser') or settings.get('STAGING_DB_CONFIRMED')!='true' or settings.get('STAGING_READ_ONLY')!='false':raise SystemExit('STAGING_ISOLATION_PROFILE_MISMATCH')
          files=sorted(data_dir.glob('enc041-preproof-*.sql.gz'),key=lambda p:p.stat().st_mtime,reverse=True)
          chosen=None
          for item in files:
              metadata=item.with_suffix('.manifest.json')
              if not item.is_file() or item.is_symlink() or not metadata.is_file():continue
              import json
              try:
                  m=json.loads(metadata.read_text())
                  payload=item.read_bytes()
                  if m.get('db')=='u293982346_encarmentest' and hashlib.sha256(payload).hexdigest()==m.get('sha256') and b'CREATE TABLE' in gzip.decompress(payload):
                      chosen=item
                      break
              except Exception:continue
          if chosen is None:raise SystemExit('PRIVATE_FULL_STAGING_BACKUP_NOT_VERIFIED')
          now=dt.datetime.now(dt.timezone.utc)
          update={
              'STAGING_CLASSIFIED_WRITES_ENABLED':'true',
              'STAGING_CLASSIFIED_BACKUP_ID':chosen.stem.replace('.sql',''),
              'STAGING_CLASSIFIED_BACKUP_CHECKED_AT':now.isoformat(),
              'STAGING_CLASSIFIED_WRITE_EXPIRES_AT':(now+dt.timedelta(minutes=20)).isoformat()
          }
          copy=backup/('enc041-prewindow-private-env-'+now.strftime('%Y%m%dT%H%M%SZ')+'.bak')
          with copy.open('xb') as target:
              os.chmod(copy,0o600)
              target.write(config.read_bytes())
              target.flush()
              os.fsync(target.fileno())
          remaining=[line for line in lines if line.strip().removeprefix('export ').split('=',1)[0].strip() not in update]
          temp=None
          try:
              with tempfile.NamedTemporaryFile(mode='w',dir=config.parent,delete=False,prefix='.enc041-env-',encoding='utf8') as target:
                  temp=Path(target.name)
                  os.chmod(temp,0o600)
                  target.write('\n'.join(remaining+[key+'='+value for key,value in update.items()])+'\n')
                  target.flush()
                  os.fsync(target.fileno())
              os.replace(temp,config)
              temp=None
          finally:
              if temp and temp.exists():temp.unlink()
          print('ENC041_CLASSIFIED_WINDOW=ENABLED_20_MINUTES')
          print('ENC041_STAGING_PROFILE_UNCHANGED=yes')
          print('ENC041_FULL_BACKUP_VERIFIED=yes')
          print('ENC041_CONFIG_PREWINDOW_BACKUP=PRIVATE')
          PY
