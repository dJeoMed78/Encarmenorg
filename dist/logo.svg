<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 350 100" width="350" height="100">
  <defs>
    <linearGradient id="grad-empresas" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-dotorg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow-empresas" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <style>
      .txt-empresas { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21.5px; font-weight: 900; fill: url(#grad-empresas); letter-spacing: 5.2px; }
      .txt-en-carmen { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21.5px; font-weight: 900; fill: #0f172a; letter-spacing: 5px; }
      .txt-dotorg { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 23px; font-weight: 900; fill: url(#grad-dotorg); font-style: italic; }
      .txt-directorio { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 900; fill: #0d9488; font-style: italic; letter-spacing: 1.2px; }
      .txt-directorio-black { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 900; fill: #1e293b; font-style: italic; letter-spacing: 1.2px; }
      .txt-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 800; fill: #0284c7; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Dolphin Graphic on Left -->
  <image href="data:image/png;base64," x="0" y="2" width="92" height="96" />

  <!-- Line 1: EMPRESAS (Degradado y resaltado) -->
  <text x="98" y="29" class="txt-empresas" filter="url(#shadow-empresas)">EMPRESAS</text>

  <!-- Line 2: EN CARMEN .ORG -->
  <text x="98" y="55" class="txt-en-carmen">EN CARMEN</text>
  <g transform="translate(283, 53) rotate(-5)">
    <text x="0" y="0" class="txt-dotorg">.ORG</text>
  </g>

  <!-- Line 3: DIRECTORIO EMPRESARIAL -->
  <text x="98" y="74">
    <tspan class="txt-directorio-black">DIRECTORIO </tspan>
    <tspan class="txt-directorio">EMPRESARIAL</tspan>
  </text>

  <!-- Line 4: PARTE DE EMPRESASENCARMEN.COM -->
  <text x="99" y="90" class="txt-sub">PARTE DE EMPRESASENCARMEN.COM</text>
</svg>
